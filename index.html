        function resetProgress() {
            if (!confirm('Reset ALL progress? This cannot be undone.')) return;
            state.stats = { completedToday: 0, streak: 0, totalAnswered: 0, totalCorrect: 0, lastStudyDate: null };
            state.wordBank.forEach(w => { w.interval = 1; w.repetitions = 0; w.ease = 2.5; w.due = Date.now(); w.history = []; });
            state.dailyLauncher = { active: false, completed: [], currentType: null, enabledTypes: [], results: [] };
            saveState();
            navigateTo('home');
        }

        // ==================== QUIZ ENGINE ====================

        async function startSpecific(type) {
            state.quiz.isInfinite = true;
            state.quiz.type = type;
            state.quiz.index = 0;
            state.quiz.answered = false;
            state.quiz.results = [];
            state.quiz.questions = await generateQuestions(type, 5);
            navigateTo('quiz');
        }

        // Approximates real Latin morphology (no macrons, so 2nd vs 3rd conj
        // "-ere" verbs aren't distinguishable by spelling alone) — good enough
        // for practice purposes, but the previous version didn't even look at
        // the word: it returned the same fixed example paradigm regardless of
        // what was asked, which is its own version of the noun/verb confusion.
        function getDeclension(latinEntry) {
            // Vocab is often given as "word, genitive" (e.g. "rex, regis") —
            // use the genitive if given, since 3rd declension can't be
            // reliably derived from the nominative alone.
            const parts = latinEntry.split(',').map(s => s.trim());
            const nom = parts[0];
            const w = nom.toLowerCase();
            if (parts.length >= 2 && /is$/i.test(parts[1])) {
                const stem = parts[1].slice(0, -2);
                return [nom, nom, stem + 'em', parts[1], stem + 'i', stem + 'e'];
            }
            if (w.endsWith('a')) {
                const stem = nom.slice(0, -1);
                return [nom, nom, stem + 'am', stem + 'ae', stem + 'ae', stem + 'a'];
            }
            if (w.endsWith('us')) {
                const stem = nom.slice(0, -2);
                return [nom, stem + 'e', stem + 'um', stem + 'i', stem + 'o', stem + 'o'];
            }
            if (w.endsWith('um')) {
                const stem = nom.slice(0, -2);
                return [nom, nom, nom, stem + 'i', stem + 'o', stem + 'o'];
            }
            // No genitive given and doesn't match 1st/2nd declension patterns —
            // likely 3rd declension; without the genitive this can only be a rough guess.
            return [nom, nom, nom + 'em', nom + 'is', nom + 'i', nom + 'e'];
        }

        function getConjugation(latinEntry) {
            // If this is "present infinitive conjNumber" shorthand, the number
            // tells us the conjugation directly — no need to guess from spelling.
            const shorthand = parseAnkiVerbShorthand(latinEntry);
            if (shorthand) {
                const stem = shorthand.infinitive.slice(0, -3); // strip -are/-ere/-ire
                if (shorthand.conj === '1') return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
                if (shorthand.conj === '2') return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
                if (shorthand.conj === '4') return [stem + 'ior', stem + 'iris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'iuntur'];
                // conj 3 (including 3rd-io) — endings are the same passive
                // present pattern either way
                return [stem + 'or', stem + 'eris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'untur'];
            }

            // Vocab is often given as full principal parts (e.g. "amo, amare,
            // amavi, amatum") — the infinitive (2nd part) reliably identifies
            // the conjugation class; the 1st person alone doesn't.
            const parts = latinEntry.split(',').map(s => s.trim());
            const inf = (parts.length >= 2 ? parts[1] : parts[0]).toLowerCase();
            if (inf.endsWith('are')) { // 1st conjugation, regular active (e.g. "amare")
                const stem = inf.slice(0, -3);
                return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
            }
            if (inf.endsWith('ari')) { // 1st conjugation deponent (e.g. "hortari")
                const stem = inf.slice(0, -3);
                return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
            }
            if (inf.endsWith('eri')) { // 2nd conjugation deponent (e.g. "vereri")
                const stem = inf.slice(0, -3);
                return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
            }
            if (inf.endsWith('ire')) { // 4th conjugation
                const stem = inf.slice(0, -3);
                return [stem + 'ior', stem + 'iris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'iuntur'];
            }
            if (inf.endsWith('ere')) {
                const stem = inf.slice(0, -3);
                // 2nd and 3rd conjugation both end "-ere" without macrons, but
                // inflect differently. The 1st principal part reliably tells
                // them apart: 2nd conj is "-eo" (timeo/video/habeo), 3rd is a
                // consonant + "-o" (mitto/dico/duco).
                if (/eo$/i.test(parts[0])) {
                    return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
                }
                return [stem + 'or', stem + 'eris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'untur'];
            }
            // Fallback: treat the first part as an already-inflected stem
            const stem = parts[0].replace(/o$/, '');
            return [stem + 'or', stem + 'ris', stem + 'tur', stem + 'mur', stem + 'mini', stem + 'ntur'];
        }

        // Shared helper for every AI call in the app. Both question generation
        // and answer marking used to duplicate this fetch — now there's one
        // place to fix if the API shape ever changes (e.g. switching providers).
        // Set jsonMode=true to request/parse a JSON object response.
        async function callAI(prompt, jsonMode) {
            if (!state.settings.apiKey || !state.settings.apiUrl) return null;
            const body = { model: state.settings.model, messages: [{ role: 'user', content: prompt }] };
            if (jsonMode) body.response_format = { type: 'json_object' };
            const res = await fetch(`${state.settings.apiUrl}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.settings.apiKey}` },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`AI request failed (${res.status})`);
            const data = await res.json();
            const content = data.choices[0].message.content;
            return jsonMode ? JSON.parse(content) : content;
        }

        // Shared by PDF upload and the manual "Sort with AI" button: takes raw
        // extracted/pasted text, splits it via AI into vocab vs grammar, and
        // writes each into the right box. Falls back to dumping raw text into
        // the vocab box (with a warning) if no AI is configured yet.
        async function sortAndInsertMaterial(rawText, sourceLabel, textareaEl) {
            if (!state.settings.apiKey || !state.settings.apiUrl) {
                alert(`No AI configured yet, so "${sourceLabel}" is being added as raw text — if it's a grammar sheet, this will likely need manual cleanup, or add an API key in Settings first so it can be sorted automatically.`);
                textareaEl.value += `\n\n--- ${sourceLabel} (unsorted — add an AI key for auto-sorting) ---\n${rawText}`;
                return;
            }
            try {
                const sorted = await sortMaterialWithAI(rawText, sourceLabel);
                if (sorted.vocab.length > 0) {
                    textareaEl.value += `\n\n--- ${sourceLabel} (vocab) ---\n` + sorted.vocab.join('\n');
                }
                if (sorted.grammar.trim()) {
                    const gArea = document.getElementById('grammarInputArea');
                    const combined = (state.materials.grammarNotes ? state.materials.grammarNotes + '\n\n' : '') + `--- ${sourceLabel} (grammar) ---\n` + sorted.grammar.trim();
                    state.materials.grammarNotes = combined;
                    if (gArea) gArea.value = combined;
                }
                if (sorted.examples && sorted.examples.trim()) {
                    const eArea = document.getElementById('styleExamplesArea');
                    const combinedEx = (state.materials.styleExamples ? state.materials.styleExamples + '\n\n' : '') + `--- ${sourceLabel} (examples) ---\n` + sorted.examples.trim();
                    state.materials.styleExamples = combinedEx;
                    if (eArea) eArea.value = combinedEx;
                }
                if (sorted.vocab.length === 0 && !sorted.grammar.trim() && !(sorted.examples && sorted.examples.trim())) {
                    textareaEl.value += `\n\n--- ${sourceLabel} (AI found nothing usable, added raw) ---\n${rawText}`;
                }
                state.materials.rawText = textareaEl.value;
                parseVocab();
                state.dailyCache = { date: null, questionsByType: {} };
                saveState();
                runAutoPipeline(); // fire-and-forget — extracts new vocab from examples, then indexes everything new
            } catch(e) {
                console.error(e);
                alert(`AI sorting failed (${e.message}) — adding "${sourceLabel}" as raw text instead. You can sort it manually, or try again once the AI connection is working.`);
                textareaEl.value += `\n\n--- ${sourceLabel} (unsorted, AI sort failed) ---\n${rawText}`;
            }
        }
        // grammar sheets mix in paradigm tables, rules, and example sentences.
        // Feeding that straight into parseVocab() (which splits every line on
        // -/=/: ) turns grammar rules into garbage "vocab" pairs. This asks the
        // AI to separate genuine vocab items from everything else, so grammar
        // content lands in its own notes field instead of the quiz pool.
        // One-time "indexing" pass: asks the AI to tag each word's semantic
        // category (for nouns/adjectives) and suggest which OTHER words in the
        // list it naturally goes with (e.g. "conicio" pairs with "saxum"/"telum";
        // "mitto" pairs with "epistula"/"nuntius"). This runs once (not per
        // question), and the result is cached in state.materials.enrichment —
        // so offline fallback sentences can pick semantically sensible word
        // combinations instead of a random noun in every slot.
        // Shared enrichment worker — indexes whatever word list it's given, in
        // chunks with spacing to avoid rate-limit bursts. Used both by the
        // manual "Index Vocabulary" button (all words) and by the automatic
        // pass after saving materials (only new/unindexed words).
        async function enrichWordList(words, onProgress) {
            const CHUNK = 25;
            const chunks = [];
            for (let i = 0; i < words.length; i += CHUNK) chunks.push(words.slice(i, i + CHUNK));
            let done = 0;
            for (const chunk of chunks) {
                if (onProgress) onProgress(done, words.length);
                const wordList = chunk.map((w, idx) => `${idx + 1}. ${w.latin} (${w.english})`).join('\n');
                const prompt = `You are indexing a Latin vocabulary list for a study app that generates practice sentences offline (without AI). For each word below, provide:
- "pos": "noun", "verb", or "adjective"
- "semanticCategory" (nouns/adjectives only, omit for verbs): one of "person", "place", "object", "animal", "abstract", "nature", "building", "time", "food", "other"
- "collocates": 2-4 OTHER words from THIS SAME LIST that commonly go together with this word in a real sentence — for a verb, nouns from the list that make sense as its subject/object (e.g. "conicio" (I throw) → nouns like "saxum" or "telum" if present in the list; "mitto" (I send) → "epistula" or "nuntius" if present); for a noun, verbs from the list that plausibly act on/with it. Only reference words that actually appear in the list below — if nothing in the list fits well, return an empty array rather than forcing an unrelated word.

Word list:
${wordList}

Return ONLY JSON: {"words": [{"latin": "(exact latin from the list)", "pos": "...", "semanticCategory": "...", "collocates": ["...", "..."]}]}`;
                try {
                    const result = await callAI(prompt, true);
                    if (result && Array.isArray(result.words)) {
                        result.words.forEach(w => {
                            if (w && typeof w.latin === 'string') {
                                state.materials.enrichment[w.latin] = {
                                    pos: (w.pos === 'verb' || w.pos === 'noun' || w.pos === 'adjective') ? (w.pos === 'adjective' ? 'noun' : w.pos) : undefined,
                                    semanticCategory: typeof w.semanticCategory === 'string' ? w.semanticCategory : undefined,
                                    collocates: Array.isArray(w.collocates) ? w.collocates.filter(c => typeof c === 'string') : []
                                };
                            }
                        });
                    }
                } catch(e) {
                    console.warn('Enrichment chunk failed', e);
                }
                done += chunk.length;
                saveState();
                await new Promise(r => setTimeout(r, 1200)); // avoid a burst of calls
            }
            parseVocab();
            saveState();
        }

        async function enrichVocabWithAI() {
            if (!state.settings.apiKey || !state.settings.apiUrl) {
                alert('Add an API key in Settings first.');
                return;
            }
            const words = state.materials.vocabList;
            if (words.length === 0) {
                alert('No vocab to index yet — save some in the Input Corpus first.');
                return;
            }
            const btn = document.getElementById('enrichBtn');
            const statusEl = document.getElementById('enrichStatus');
            btn.disabled = true;
            await enrichWordList(words, (done, total) => { statusEl.textContent = `Indexing ${done}/${total} words...`; });
            statusEl.textContent = `Indexed ${words.length} words.`;
            btn.disabled = false;
            render();
        }

        // Runs quietly after materials are saved — indexes only words that
        // aren't already in state.materials.enrichment, so re-saving doesn't
        // re-spend API calls on words already indexed. This only covers words
        // that are actually in the vocab list (Input Corpus) — a word that
        // only appears inside a Style Examples sentence, but isn't also in
        // the vocab list, won't get picked up here (there's no reliable way
        // to split arbitrary sentence text into headwords to index).
        let autoIndexRunning = false;
        async function autoIndexNewWords() {
            if (autoIndexRunning) return;
            if (!state.settings.apiKey || !state.settings.apiUrl) return;
            const newWords = state.materials.vocabList.filter(w => !state.materials.enrichment[w.latin]);
            if (newWords.length === 0) return;
            autoIndexRunning = true;
            const statusEl = document.getElementById('enrichStatus');
            if (statusEl) statusEl.textContent = `Auto-indexing ${newWords.length} new word(s)...`;
            try {
                await enrichWordList(newWords, (done, total) => {
                    const el = document.getElementById('enrichStatus');
                    if (el) el.textContent = `Auto-indexing new words: ${done}/${total}...`;
                });
            } finally {
                autoIndexRunning = false;
                const el = document.getElementById('enrichStatus');
                if (el) el.textContent = `Indexed ${state.materials.vocabList.length} words.`;
                render();
            }
        }

        async function sortMaterialWithAI(rawText, sourceLabel) {
            const prompt = `You are processing raw text extracted from a Latin study document (source: ${sourceLabel}), which may be a vocab list, a grammar sheet, or a past test/worksheet containing full example sentences with translations.

Split it into three categories:
1. "vocab": an array of strings, each formatted as "latin - english" (use full principal parts where given, e.g. "amo, amare, amavi, amatum - to love"). Only genuine single-word/short vocabulary entries — not sentences, not grammar rules.
2. "grammar": a single string containing grammar content — declension/conjugation tables, case/tense/mood rules, word-order rules, explanations — with vocabulary and example sentences removed.
3. "examples": a single string containing full graded example sentences with their translations, one pair per line as "Latin sentence = English translation" (either direction), taken verbatim from test/worksheet content. This is for sentences a teacher actually wrote or graded — not simple made-up phrases, and not grammar-rule explanations.

If a section clearly isn't Latin study material (e.g. page headers, OCR noise), omit it entirely rather than forcing it into any category.

Return ONLY JSON in this exact shape, no other text: {"vocab": ["...", "..."], "grammar": "...", "examples": "..."}

Raw text:
"""
${rawText.substring(0, 6000)}
"""`;
            const parsed = await callAI(prompt, true);
            return {
                vocab: (parsed && Array.isArray(parsed.vocab)) ? parsed.vocab : [],
                grammar: (parsed && typeof parsed.grammar === 'string') ? parsed.grammar : '',
                examples: (parsed && typeof parsed.examples === 'string') ? parsed.examples : ''
            };
        }

        async function generateQuestions(type, count) {
            const vocab = state.wordBank.length > 0 ? state.wordBank : state.materials.vocabList;
            if (vocab.length === 0) vocab.push({latin:'puella',english:'girl',pos:'noun'}, {latin:'bonus',english:'good',pos:'noun'});

            // Build a clean, explicitly POS-labeled vocab list for the AI, instead
            // of dumping the raw corpus text — the raw text mixes nouns, verbs,
            // and adjectives with no labels, which is exactly what let a verb's
            // principal parts get used as if it were a noun.
            function buildVocabSummary() {
                const nouns = vocab.filter(v => (v.pos || classifyPos(v.latin, v.english)) === 'noun').slice(0, 40);
                const verbs = vocab.filter(v => (v.pos || classifyPos(v.latin, v.english)) === 'verb').slice(0, 40);
                let out = '';
                if (nouns.length) out += `Nouns/adjectives: ${nouns.map(v => `${v.latin} (${v.english})`).join('; ')}\n`;
                if (verbs.length) out += `Verbs (principal parts given — inflect/conjugate as needed, don't paste the dictionary form verbatim): ${verbs.map(v => `${v.latin} (${v.english})`).join('; ')}`;
                return out;
            }
            
            if (state.settings.apiKey && state.settings.apiUrl && type !== 'vocab' && type !== 'declining' && type !== 'conjugation') {
                try {
                    const grammarContext = state.materials.grammarNotes
                        ? `\nGrammar rules and requirements to follow (e.g. required word order, tenses/moods in focus, forms taught so far): ${state.materials.grammarNotes.substring(0, 1000)}`
                        : '';
                    const styleContext = state.materials.styleExamples
                        ? `\nActual example sentences from past tests — match this exact style, sentence complexity, and vocabulary usage as closely as possible: ${state.materials.styleExamples.substring(0, 1500)}`
                        : '';
                    const focusContext = state.dailyLauncher.focusTopic
                        ? `\nToday's specific focus, requested by the student: "${state.dailyLauncher.focusTopic}". As much as this question type allows, prioritize testing this concept specifically (e.g. if it's a grammar topic like "subjunctive" or "qui/quae/quod", make sure most questions actually require using/identifying it; if it's a vocab theme, favor relevant words). Don't force it somewhere it genuinely doesn't fit the question type, but lean into it wherever it does.`
                        : '';
                    // latToEng/engToLat are deliberately short phrases; latSentence/engSentence
                    // need to be genuinely full, exam-style sentences, not just longer phrases.
                    const lengthInstruction = (type === 'latSentence' || type === 'engSentence')
                        ? '\nEach question must be a FULL, grammatically complete Latin sentence (not a short phrase) — use subordinate/relative clauses, ablative absolutes, passive or deponent verbs, or participles where appropriate, matching the complexity of any style examples and grammar notes given below. Do not produce simple 3-4 word phrases.'
                        : (type === 'latToEng' || type === 'engToLat')
                            ? '\nEach question should be a short, simple phrase or single short clause — not a long multi-clause sentence.'
                            : '';
                    // Which field (prompt vs target) holds Latin vs English is
                    // NOT obvious from the type name alone to a model generating
                    // a whole batch at once — leaving this implicit is what let
                    // "prompt"/"target" get swapped for a given type sometimes
                    // (e.g. a "Latin to English" question coming back with
                    // English in the prompt and Latin in the target). Spell it
                    // out explicitly instead of relying on inference.
                    const directionMap = {
                        latToEng: '"prompt" must be the Latin phrase/sentence; "target" must be its English translation.',
                        engToLat: '"prompt" must be the English phrase/sentence; "target" must be its Latin translation.',
                        latSentence: '"prompt" must be the Latin sentence; "target" must be its English translation.',
                        engSentence: '"prompt" must be the English sentence; "target" must be its Latin translation.'
                    };
                    const directionInstruction = directionMap[type] ? `\nField mapping — get this right for every question: ${directionMap[type]}` : '';
                    const prompt = `Generate ${count} Latin ${type} practice questions.${lengthInstruction}${directionInstruction}
Vocabulary is labeled by part of speech below — use nouns/adjectives only where a noun/adjective belongs (subject, object, etc.), and verbs only as the sentence's actual verb, correctly conjugated/inflected for the person, tense, and mood the sentence needs (never paste a verb's raw principal-parts listing into the sentence as if it were a word). Every generated sentence must be grammatically valid Latin.
Vary the vocabulary and sentence pattern across the ${count} questions — don't reuse the same word pair or sentence structure repeatedly; each question should feel distinct from the others.
${buildVocabSummary()}${grammarContext}${styleContext}${focusContext}
Return ONLY JSON: {"questions": [{"type":"${type}", "prompt":"...", "target":"...", "extra":"..."}]}`;
                    const parsed = await callAI(prompt, true);
                    if (parsed && Array.isArray(parsed.questions)) {
                        // Drop anything malformed rather than trusting the
                        // response wholesale — a missing prompt/target would
                        // otherwise surface as a broken, unanswerable question.
                        const valid = parsed.questions.filter(qq =>
                            qq && typeof qq.prompt === 'string' && qq.prompt.trim() &&
                            typeof qq.target === 'string' && qq.target.trim()
                        ).map(qq => {
                            // Safety net: if this type's Latin/English fields
                            // look swapped (e.g. a "latSentence" question with
                            // English in "prompt" and Latin in "target"), fix it
                            // rather than serve a backwards question.
                            const latinFirst = qq.type === 'latToEng' || qq.type === 'latSentence';
                            const englishFirst = qq.type === 'engToLat' || qq.type === 'engSentence';
                            if (latinFirst && looksEnglish(qq.prompt) && !looksEnglish(qq.target)) {
                                return { ...qq, prompt: qq.target, target: qq.prompt, source: 'ai' };
                            }
                            if (englishFirst && !looksEnglish(qq.prompt) && looksEnglish(qq.target)) {
                                return { ...qq, prompt: qq.target, target: qq.prompt, source: 'ai' };
                            }
                            return { ...qq, source: 'ai' };
                        });
                        if (valid.length > 0) return valid;
                    }
                } catch(e) { console.warn('AI gen failed, using local', e); }
            }

            const questions = [];
            const dir = state.settings.vocabDirection;

            // Different question types need different parts of speech — asking
            // someone to "conjugate" a noun, or plugging a verb's principal
            // parts into a sentence's subject slot, produces nonsense. Pick
            // from the right pool per type instead of any random vocab word.
            function pickVocab(pos) {
                const pool = vocab.filter(v => (v.pos || classifyPos(v.latin, v.english)) === pos);
                const source = pool.length > 0 ? pool : vocab;
                return source[Math.floor(Math.random() * source.length)];
            }
            const VERB_TYPES = ['conjugation', 'principalParts', 'moodTenseVoice'];
            // Turns a stored "to send" style gloss into "sends" for use in a
            // natural English sentence, with basic spelling rules covered.
            function thirdPersonVerbForm(english) {
                const base = english.replace(/^to\s+/i, '').trim().split(/[,;]/)[0].trim();
                if (/[sxz]$|[cs]h$/i.test(base)) return base + 'es';
                if (/[^aeiou]y$/i.test(base)) return base.slice(0, -1) + 'ies';
                return base + 's';
            }

            const NOUN_TYPES = ['declining', 'latToEng', 'engToLat', 'latSentence', 'engSentence', 'genderCase', 'unseen'];

            // Active present 3rd-singular form — used for the collocate-based
            // sentence pattern below. Deponents are skipped for this (their
            // active-meaning 3sg is actually passive in form, e.g. "hortatur",
            // which would need separate handling), kept simple by excluding them.
            function getActivePresent3sg(latinEntry) {
                const shorthand = parseAnkiVerbShorthand(latinEntry);
                let inf, conj;
                if (shorthand) { inf = shorthand.infinitive.toLowerCase(); conj = shorthand.conj; }
                else {
                    const parts = latinEntry.split(',').map(s => s.trim());
                    inf = (parts.length >= 2 ? parts[1] : parts[0]).toLowerCase();
                    if (inf.endsWith('are')) conj = '1';
                    else if (inf.endsWith('ire')) conj = '4';
                    else if (inf.endsWith('ere')) conj = /eo$/i.test(parts[0]) ? '2' : '3';
                    else return null; // deponent (-ari/-eri) or unrecognized — skip
                }
                if (!inf.endsWith('are') && !inf.endsWith('ere') && !inf.endsWith('ire')) return null;
                const stem = inf.slice(0, -3);
                if (conj === '1') return stem + 'at';
                if (conj === '2') return stem + 'et';
                if (conj === '4') return stem + 'it';
                return stem + 'it';
            }

            // Picks a verb that's been AI-indexed with real collocates, plus one
            // of those collocate nouns actually present in the current vocab —
            // e.g. "mitto" linked to "epistula" — so the sentence is a real,
            // sensible pairing instead of two random words.
            function pickVerbCollocatePair() {
                const verbs = vocab.filter(vv => (vv.pos || classifyPos(vv.latin, vv.english)) === 'verb'
                    && Array.isArray(vv.collocates) && vv.collocates.length > 0
                    && getActivePresent3sg(vv.latin));
                if (verbs.length === 0) return null;
                const verb = verbs[Math.floor(Math.random() * verbs.length)];
                const objCandidates = vocab.filter(n => verb.collocates.includes(n.latin));
                if (objCandidates.length === 0) return null;
                const obj = objCandidates[Math.floor(Math.random() * objCandidates.length)];
                const subjPool = vocab.filter(n => (n.pos || classifyPos(n.latin, n.english)) === 'noun' && n.latin !== obj.latin);
                const subj = subjPool.length > 0 ? subjPool[Math.floor(Math.random() * subjPool.length)] : { latin: 'puella', english: 'girl' };
                return { verb, obj, subj };
            }


            for (let i = 0; i < count; i++) {
                let v;
                if (type === 'principalParts') {
                    // Only quiz words that actually have principal parts to
                    // give — the Anki-style "mitto mittere 3" shorthand has no
                    // perfect/supine stored, so it can't be a fair question here.
                    const withParts = vocab.filter(vv => (vv.pos || classifyPos(vv.latin, vv.english)) === 'verb' && !parseAnkiVerbShorthand(vv.latin) && vv.latin.split(',').length >= 3);
                    v = withParts.length > 0 ? withParts[Math.floor(Math.random() * withParts.length)] : pickVocab('verb');
                } else if (VERB_TYPES.includes(type)) v = pickVocab('verb');
                else if (NOUN_TYPES.includes(type)) v = pickVocab('noun');
                else v = vocab[Math.floor(Math.random() * vocab.length)];
                let q = { type };
                
                switch(type) {
                    case 'vocab':
                        if (dir === 'latToEng') {
                            q = { type: 'vocab', prompt: v.latin, target: v.english, extra: '' };
                        } else {
                            q = { type: 'vocab', prompt: v.english, target: v.latin, extra: '' };
                        }
                        break;
                    case 'latToEng':
                        q.prompt = `${v.latin} in urbe habitat.`;
                        q.target = `The ${v.english} lives in the city.`;
                        break;
                    case 'engToLat':
                        q.prompt = `The ${v.english} lives in the city.`;
                        q.target = `${v.latin} in urbe habitat`;
                        break;
                    case 'latSentence': {
                        const pair = pickVerbCollocatePair();
                        if (pair && Math.random() < 0.6) {
                            const subjNom = pair.subj.latin.split(',')[0].trim();
                            const objAcc = getDeclension(pair.obj.latin)[2];
                            const verbForm = getActivePresent3sg(pair.verb.latin);
                            const subjEn = pair.subj.english.split(/[,;]/)[0].trim();
                            const objEn = pair.obj.english.split(/[,;]/)[0].trim();
                            const verbEn = thirdPersonVerbForm(pair.verb.english);
                            q.prompt = `${subjNom} ${objAcc} ${verbForm}.`;
                            q.target = `The ${subjEn} ${verbEn} the ${objEn}.`;
                            break;
                        }
                        const v2 = pickVocab('noun');
                        const bank = [
                            { lat: `${v.latin}, qui in urbe habitabat, ${v2.latin} vidit.`, eng: `The ${v.english}, who was living in the city, saw the ${v2.english}.` },
                            { lat: `Cum ${v.latin} advenisset, cives laeti erant.`, eng: `When the ${v.english} had arrived, the citizens were happy.` },
                            { lat: `${v.latin} a ${v2.latin} laudatus est.`, eng: `The ${v.english} was praised by the ${v2.english}.` },
                            { lat: `Militibus in urbe pugnantibus, ${v.latin} fugit.`, eng: `With the soldiers fighting in the city, the ${v.english} fled.` },
                            { lat: `Nemo dubitat quin ${v.latin} ${v2.latin} amet.`, eng: `No one doubts that the ${v.english} loves the ${v2.english}.` }
                        ];
                        const pick = bank[i % bank.length];
                        q.prompt = pick.lat;
                        q.target = pick.eng;
                        break;
                    }
                    case 'engSentence': {
                        const pair = pickVerbCollocatePair();
                        if (pair && Math.random() < 0.6) {
                            const subjNom = pair.subj.latin.split(',')[0].trim();
                            const objAcc = getDeclension(pair.obj.latin)[2];
                            const verbForm = getActivePresent3sg(pair.verb.latin);
                            const subjEn = pair.subj.english.split(/[,;]/)[0].trim();
                            const objEn = pair.obj.english.split(/[,;]/)[0].trim();
                            const verbEn = thirdPersonVerbForm(pair.verb.english);
                            q.prompt = `The ${subjEn} ${verbEn} the ${objEn}.`;
                            q.target = `${subjNom} ${objAcc} ${verbForm}`;
                            break;
                        }
                        const v2 = pickVocab('noun');
                        const bank = [
                            { eng: `The ${v.english}, having been warned by the ${v2.english}, did not delay.`, lat: `${v.latin}, a ${v2.latin} monitus, non cunctatus est` },
                            { eng: `Although the ${v.english} was brave, he feared the ${v2.english}.`, lat: `quamquam ${v.latin} fortis erat, ${v2.latin} timuit` },
                            { eng: `The ${v.english} will be sent to the city by the ${v2.english}.`, lat: `${v.latin} ab ${v2.latin} in urbem mittetur` },
                            { eng: `We do not know where the ${v.english} carried the ${v2.english}.`, lat: `nescimus ubi ${v.latin} ${v2.latin} portaverit` },
                            { eng: `The ${v.english} having been captured, the citizens rejoiced.`, lat: `${v.latin} capto, cives gavisi sunt` }
                        ];
                        const pick = bank[i % bank.length];
                        q.prompt = pick.eng;
                        q.target = pick.lat;
                        break;
                    }
                    case 'declining':
                        const forms = getDeclension(v.latin);
                        q.prompt = `Decline: ${v.latin}`;
                        q.target = `Nom. ${forms[0]}, Voc. ${forms[1]}, Acc. ${forms[2]}, Gen. ${forms[3]}, Dat. ${forms[4]}, Abl. ${forms[5]}`;
                        break;
                    case 'conjugation':
                        const conjForms = getConjugation(v.latin);
                        q.prompt = `Conjugate (passive present): ${v.latin}`;
                        q.target = `1st: ${conjForms[0]}, 2nd: ${conjForms[1]}, 3rd: ${conjForms[2]}, 1st pl: ${conjForms[3]}, 2nd pl: ${conjForms[4]}, 3rd pl: ${conjForms[5]}`;
                        break;
                    case 'genderCase': {
                        // Deriving number/gender/case for an arbitrary noun form
                        // needs real morphology, not a guess — these are real
                        // forms (from your own test) with correct answers,
                        // rotating through so it's not always the same one.
                        const bank = [
                            { form: 'navem', ans: 'Singular, Feminine, Accusative' },
                            { form: 'proelii', ans: 'Singular, Neuter, Genitive' },
                            { form: 'fluminum', ans: 'Plural, Neuter, Genitive' },
                            { form: 'senatui', ans: 'Singular, Masculine, Dative' },
                            { form: 'nunti', ans: 'Singular, Masculine, Genitive' },
                            { form: 'tempestatis', ans: 'Singular, Feminine, Genitive' },
                            { form: 'nautas', ans: 'Plural, Masculine, Accusative' }
                        ];
                        const pick = bank[i % bank.length];
                        q.prompt = `What is the number, gender, and case of "${pick.form}"?`;
                        q.target = pick.ans;
                        break;
                    }
                    case 'principalParts': {
                        // Vocab already stores full principal parts as v.latin
                        // (e.g. "amo, amare, amavi, amatum") — quiz on just the
                        // first form, and the correct answer is simply what's
                        // already stored, not a regex-guessed reconstruction.
                        const firstForm = v.latin.split(',')[0].trim();
                        q.prompt = `Give principal parts for: ${firstForm}`;
                        q.target = v.latin;
                        break;
                    }
                    case 'moodTenseVoice': {
                        const bank = [
                            { form: 'ambulabit', ans: 'Indicative, Future, Active' },
                            { form: 'laudata est', ans: 'Indicative, Perfect, Passive' },
                            { form: 'regeret', ans: 'Subjunctive, Imperfect, Active' },
                            { form: 'abstulit', ans: 'Indicative, Perfect, Active' },
                            { form: 'fac', ans: 'Imperative, Present, Active' },
                            { form: 'monuissem', ans: 'Subjunctive, Pluperfect, Active' },
                            { form: 'docebamur', ans: 'Indicative, Imperfect, Passive' },
                            { form: 'absit', ans: 'Subjunctive, Present, Active' },
                            { form: 'missum erat', ans: 'Indicative, Pluperfect, Passive' },
                            { form: 'audientur', ans: 'Indicative, Future, Passive' },
                            { form: 'portate', ans: 'Imperative, Present, Active' },
                            { form: 'ablatum erit', ans: 'Indicative, Future Perfect, Passive' }
                        ];
                        const pick = bank[i % bank.length];
                        q.prompt = `Identify mood, tense, and voice: "${pick.form}"`;
                        q.target = pick.ans;
                        break;
                    }
                    case 'unseen':
                        q.prompt = `Read: ${v.latin} ad urbem ambulavit. Quid fecit?`;
                        q.target = `He/she walked to the city.`;
                        break;
                }
                q.source = 'fallback';
                questions.push(q);
            }
            return questions;
        }

        function attachKeybinds() {
            const std = document.getElementById('ans_standard');
            const vcb = document.getElementById('ans_vocab');
            
            if (std) {
                std.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleEnter(); }
                });
                std.focus();
            }
            
            if (vcb) {
                vcb.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); handleEnter(); }
                });
                vcb.focus();
            }
        }

        function handleEnter() {
            if (state.quiz.answered) {
                nextQuestion();
            } else {
                evaluateAnswer();
            }
        }

        function toggleAskInput() {
            const area = document.getElementById('askInputArea');
            area.classList.toggle('hidden');
            if (!area.classList.contains('hidden')) document.getElementById('askInput').focus();
        }

        async function askAboutQuestion() {
            const input = document.getElementById('askInput');
            const question = input.value.trim();
            if (!question) return;
            if (!state.settings.apiKey || !state.settings.apiUrl) {
                alert('Add an API key in Settings first — this needs the AI to answer.');
                return;
            }
            const ctx = state.quiz.askContext;
            const answersEl = document.getElementById('askAnswers');
            const btn = document.getElementById('askSubmitBtn');
            btn.disabled = true;
            const qId = 'ask_' + Date.now();
            answersEl.innerHTML += `
                <div class="bg-stone-50 border border-stone-200 rounded-xl p-3 text-sm" id="${qId}">
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-stone-400 italic mt-1"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Thinking...</p>
                </div>`;
            input.value = '';
            try {
                const prompt = `A Latin student is asking about a practice question they just did.
Question they were given: "${ctx.prompt}"
Correct/model answer: "${ctx.target}"
What they submitted: "${ctx.userAns || '(nothing, they revealed the answer)'}"
Their question: "${question}"
Answer their specific question clearly and directly, like a teacher explaining a grammar point — a few sentences is fine, don't pad it out. If their question reveals a misunderstanding about a specific grammar term, correct it plainly.`;
                const answer = await callAI(prompt, false);
                document.getElementById(qId).innerHTML = `
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-stone-600 mt-1">${answer}</p>`;
            } catch(e) {
                document.getElementById(qId).innerHTML = `
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-terracotta-600 mt-1">Couldn't get an answer right now (${e.message}). Try again in a moment.</p>`;
            }
            btn.disabled = false;
        }

        async function evaluateAnswer() {
            const q = state.quiz.questions[state.quiz.index];
            const btn = document.getElementById('submitBtn');
            let userAns = "";
            const isVocab = q.type === 'vocab';
            const isEngLat = q.type === 'engToLat' || q.type === 'engSentence';
            
            if (isVocab) {
                userAns = document.getElementById('ans_vocab').value.trim();
            } else {
                userAns = document.getElementById('ans_standard').value.trim();
            }
            
            state.quiz.answered = true;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            
            let feedback = '';
            let isCorrect = false;
            const cleanAns = userAns.toLowerCase().replace(/[.,!?;:]/g,'').trim();
            const cleanTgt = q.target.toLowerCase().replace(/[.,!?;:]/g,'').trim();

            // Offline fallback only — exact match, or for vocab, an exact match
            // against any one synonym in a comma/semicolon-separated gloss.
            // (Previously this accepted ANY 3+ letter substring of the target,
            // e.g. "kin" would match "king" — too lenient to trust.)
            function heuristicCorrect() {
                if (isVocab) {
                    const parts = cleanTgt.split(/[,;\/]| or /).map(s => s.trim()).filter(Boolean);
                    return parts.includes(cleanAns);
                }
                return cleanAns === cleanTgt;
            }

            if (userAns === '') {
                isCorrect = false;
            } else if (state.settings.apiKey && state.settings.apiUrl) {
                // Let the AI make the actual correctness call, not just add
                // commentary after a rigid string-match — translation questions
                // in particular have many valid phrasings that exact-match would
                // wrongly reject.
                try {
                    const prompt = `You are marking a Latin student's answer like a teacher.
Question: "${q.prompt}"
Model/expected answer: "${q.target}"
Student's answer: "${userAns}"
Judge whether the student's answer is an acceptable answer — accept valid alternative phrasing, synonyms, and word order for translations; for vocab, accept any valid synonym. Don't require an exact word-for-word match to the model answer.
Return ONLY JSON: {"correct": true or false, "feedback": "1-2 sentence teacher feedback, concise — if correct, briefly affirm; if wrong, explain specifically what was wrong (tense, agreement, word order, vocabulary, etc.)"}`;
                    const result = await callAI(prompt, true);
                    if (result && typeof result.correct === 'boolean') {
                        isCorrect = result.correct;
                        feedback = typeof result.feedback === 'string' ? result.feedback : '';
                    } else {
                        isCorrect = heuristicCorrect();
                    }
                } catch(e) {
                    isCorrect = heuristicCorrect();
                    feedback = "(AI marking unavailable right now — marked by exact match instead.)";
                }
            } else {
                isCorrect = heuristicCorrect();
            }
            
            const fb = document.getElementById('feedbackBox');
            fb.classList.remove('hidden');
            
            if (userAns === '') {
                fb.innerHTML = `
                    <div class="text-sm border-b border-stone-200 pb-2 mb-2 font-bold uppercase tracking-wider text-stone-500">
                        <i class="fa-solid fa-eye mr-1"></i> Revealed
                    </div>
                    <div class="space-y-1 text-sm font-serif text-stone-800">
                        <p><strong class="font-sans text-xs uppercase text-stone-500">Correct Answer:</strong> ${q.target}</p>
                    </div>
                `;
            } else {
                fb.innerHTML = `
                    <div class="text-sm border-b border-stone-200 pb-2 mb-2 font-bold uppercase tracking-wider ${isCorrect ? 'text-sage-700' : 'text-terracotta-600'}">
                        ${isCorrect ? '<i class="fa-solid fa-check-circle mr-1"></i> Optime!' : '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Feedback'}
                    </div>
                    <div class="space-y-1 text-sm font-serif text-stone-800">
                        <p><strong class="font-sans text-xs uppercase text-stone-500">Correct:</strong> ${q.target}</p>
                        <p class="pt-1"><strong class="font-sans text-xs uppercase text-stone-500">Yours:</strong> <span class="${isCorrect ? 'text-sage-700' : 'text-terracotta-700'}">${userAns}</span></p>
                        ${feedback ? `<p class="pt-2 text-stone-600 italic border-t border-stone-200 mt-2 pt-2">${feedback}</p>` : ''}
                    </div>
                `;
            }

            // Store context for "ask a question" — needs the question, correct
            // answer, and what was submitted, regardless of right/wrong.
            state.quiz.askContext = { prompt: q.prompt, target: q.target, userAns, type: q.type };
            const askBox = document.getElementById('askBox');
            askBox.classList.remove('hidden');
            askBox.innerHTML = `
                <button onclick="toggleAskInput()" id="askToggleBtn" class="text-xs font-bold text-stone-500 hover:text-stone-800 transition">
                    <i class="fa-solid fa-circle-question mr-1"></i> Not sure why? Ask about this question
                </button>
                <div id="askInputArea" class="hidden mt-2">
                    <div class="flex gap-2">
                        <input type="text" id="askInput" placeholder="e.g. why is this indicative not subjunctive?" class="flex-1 text-sm border border-stone-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sage-500 outline-none">
                        <button onclick="askAboutQuestion()" id="askSubmitBtn" class="px-4 py-2 bg-stone-900 hover:bg-black text-white text-sm font-bold rounded-lg transition">Ask</button>
                    </div>
                    <div id="askAnswers" class="space-y-2 mt-3"></div>
                </div>
            `;
            
            btn.innerHTML = `Next <span class="text-xs opacity-70 ml-1">(Enter)</span> <i class="fa-solid fa-arrow-right ml-2"></i>`;
            btn.className = "w-full sm:w-auto px-10 py-4 bg-stone-900 hover:bg-black text-white font-bold rounded-xl shadow-lg transition text-lg mt-4";
            btn.disabled = false;
            btn.onclick = () => { recordTypedResult(isCorrect && userAns !== ''); nextQuestion(); };
            
            state.stats.completedToday++;
            state.stats.totalAnswered++;
            if (isCorrect) state.stats.totalCorrect++;
            updateStreak();
            saveState();
        }

        function recordTypedResult(correct) {
            state.quiz.results.push({ correct });
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (state.stats.lastStudyDate !== today) {
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                if (state.stats.lastStudyDate === yesterday) state.stats.streak++;
                else state.stats.streak = 1;
                state.stats.lastStudyDate = today;
            }
        }

        async function nextQuestion() {
            state.quiz.index++;
            state.quiz.answered = false;
            
            if (state.quiz.isInfinite && state.quiz.index >= state.quiz.questions.length - 1) {
                const more = await generateQuestions(state.quiz.type, 5);
                state.quiz.questions.push(...more);
            }
            
            if (!state.quiz.isInfinite && state.quiz.index >= state.quiz.questions.length) {
                if (state.dailyLauncher.active) {
                    finishDailyCategory();
                } else {
                    const correct = state.quiz.results.filter(r => r.correct).length;
                    const total = state.quiz.results.length;
                    alert(`Session complete! ${correct}/${total} correct.`);
                    navigateTo('home');
                }
                return;
            }
            
            render();
        }

        function exportHTML() {
            const code = document.documentElement.outerHTML;
            const blob = new Blob([code], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'latin_practice.html';
            a.click();
        }

        async function init() {
            loadState();
            await hydrateImages();
            render();
        }
        init();
    </script>
</body>
