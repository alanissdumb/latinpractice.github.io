<body class="bg-parchment-50 text-stone-800 font-sans min-h-full flex flex-col selection:bg-sage-200 selection:text-sage-900">

    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-1">

    <main id="appContainer" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DEFAULT_STATE = {
            view: 'home',
            stats: { completedToday: 0, streak: 0, totalAnswered: 0, totalCorrect: 0, lastStudyDate: null },
            settings: {
                apiKey: '',
                apiUrl: 'https://api.openai.com/v1',
                model: 'gpt-3.5-turbo',
                vocabDirection: 'latToEng',
                dailyMix: {
                    vocab: true, declining: true, conjugation: true, genderCase: true, principalParts: true,
                    latToEng: true, engToLat: true, latSentence: true, engSentence: true, unseen: false, moodTenseVoice: false,
                    countPerType: 20
                },
                autoAdvance: false,
                soundEffects: false
            },
            materials: {
                rawText: "puella - girl\nbonus - good\ncurro, currere, cucurri, cursum - to run\nhortor, hortari, hortatus sum - to encourage\nrex, regis - king\nurbs, urbis - city\nmagnus - great\ntimeo, timere, timui - to fear\namo, amare, amavi, amatum - to love\nmiles, militis - soldier\nbellum - war\npax, pacis - peace\nporto, portare, portavi, portatus - to carry\nmitto, mittere, misi, missus - to send",
                vocabList: [],
                images: [],
                grammarNotes: '',
                styleExamples: '',
                forceSwap: false,
                enrichment: {},
                lastExtractedExamples: ''
            },
            wordBank: [],
            quiz: { active: false, type: '', questions: [], index: 0, isInfinite: false, results: [], answered: false },
            dailyLauncher: { active: false, completed: [], currentType: null, enabledTypes: [], generating: false, focusTopic: '' },
            dailyCache: { date: null, focusTopic: '', questionsByType: {} }
        };

        let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

        function loadState() {
            try {
                const saved = localStorage.getItem('latin_practice_app_v4');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...DEFAULT_STATE, ...parsed };
                    if (parsed.settings) state.settings = { ...DEFAULT_STATE.settings, ...parsed.settings };
                    if (parsed.settings && parsed.settings.dailyMix) state.settings.dailyMix = { ...DEFAULT_STATE.settings.dailyMix, ...parsed.settings.dailyMix };
                    if (parsed.materials) state.materials = { ...DEFAULT_STATE.materials, ...parsed.materials };
                    if (parsed.stats) state.stats = { ...DEFAULT_STATE.stats, ...parsed.stats };
                    if (parsed.dailyLauncher) state.dailyLauncher = { ...DEFAULT_STATE.dailyLauncher, ...parsed.dailyLauncher };
                    if (parsed.dailyCache) state.dailyCache = { ...DEFAULT_STATE.dailyCache, ...parsed.dailyCache };
                }
            } catch(e) {}
            parseVocab();
        }

        // Runs once at startup: pulls images out of IndexedDB (where they now
        // live) and, if this is the first load after upgrading, migrates any
        // images left over in the old localStorage-based state into IndexedDB.
        async function hydrateImages() {
            const legacyImages = state.materials.images || [];
            const dbImages = await loadImagesFromDB();
            if (dbImages.length > 0) {
                state.materials.images = dbImages;
            } else if (legacyImages.length > 0) {
                state.materials.images = legacyImages;
                await saveImagesToDB(legacyImages);
            } else {
                state.materials.images = [];
            }
        }

        // Images are base64 strings, which are large. localStorage has a ~5-10MB
        // total quota shared across the whole app, so storing images there (as
        // before) risks silently failing to save once you've uploaded a handful
        // of photos. IndexedDB has a much larger quota (typically hundreds of MB+),
        // so images now live there instead, separate from the rest of the state.
        const IMG_DB_NAME = 'latin_practice_images';
        const IMG_STORE = 'images';

        function openImageDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IMG_DB_NAME, 1);
                req.onupgradeneeded = () => { req.result.createObjectStore(IMG_STORE); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveImagesToDB(images) {
            try {
                const db = await openImageDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(IMG_STORE, 'readwrite');
                    tx.objectStore(IMG_STORE).put(images, 'all');
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch(e) { console.warn('Could not save images to IndexedDB', e); }
        }

        async function loadImagesFromDB() {
            try {
                const db = await openImageDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(IMG_STORE, 'readonly');
                    const req = tx.objectStore(IMG_STORE).get('all');
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch(e) { return []; }
        }

        function saveState() {
            // Strip images out of the localStorage payload — they're persisted
            // separately via saveImagesToDB() so they don't count against the
            // localStorage quota.
            const toSave = JSON.parse(JSON.stringify(state));
            toSave.materials.images = [];
            localStorage.setItem('latin_practice_app_v4', JSON.stringify(toSave));
            saveImagesToDB(state.materials.images);
        }

        // Rough part-of-speech guess so templates/prompts don't shove a verb's
        // principal parts into a noun slot (or vice versa). Not linguistically
        // perfect, but "to " in the gloss and comma-count in the Latin form are
        // reliable enough signals for how vocab lists are normally written.
        // Anki decks commonly store verbs as "present infinitive conjugationNumber"
        // with no principal parts at all, e.g. "mitto mittere 3" or "capio capere 3i"
        // (io = 3rd-io). Recognizing this explicitly is far more reliable than
        // guessing conjugation from spelling, since the number IS the conjugation.
        function parseAnkiVerbShorthand(latin) {
            const m = latin.trim().match(/^(\S+)\s+(\S+)\s+([1-4])(i(?:o)?)?$/i);
            if (!m) return null;
            return { present: m[1], infinitive: m[2], conj: m[3], isIo: !!m[4] };
        }

        function classifyPos(latin, english) {
            const rawParts = latin.split(',').map(s => s.trim());
            // Adjectives are conventionally abbreviated like "fessus, -a, -um"
            // (a 3-part comma list) — that's endings, not principal parts, so
            // it must never be classified as a verb regardless of part count.
            if (rawParts.length >= 2 && rawParts.slice(1).some(p => p.startsWith('-'))) return 'noun';
            if (parseAnkiVerbShorthand(latin)) return 'verb';
            if (/^to\s/i.test(english.trim()) || rawParts.length >= 3) return 'verb';
            return 'noun'; // covers nouns and adjectives — both fine to plug into a nominal slot
        }

        // Splits a vocab line into [latin, english]. Prefers a hyphen/equals/colon
        // surrounded by whitespace as the actual field separator — a bare,
        // unspaced hyphen is usually part of a Latin abbreviation (e.g. "-a, -um")
        // or a footnote marker, not the divider between Latin and English.
        function splitVocabLine(line) {
            let m = line.match(/^(.*?)\s[-=:]\s(.*)$/);
            if (!m) m = line.match(/^(.*?)[=:](.*)$/);
            if (!m) m = line.match(/^(.*?)-(.*)$/);
            if (!m) return null;
            return [m[1].trim(), m[2].trim()];
        }

        // Some source material lists English before Latin (common in some
        // textbook glossaries), which would otherwise get stored backwards.
        // Flag a field as "looks like English" two ways: common English
        // function words (skipping "a"/"an" — too short, and collide with
        // Latin abbreviation letters like the "-a" in "fessus, -a, -um"), and
        // for single-word glosses with no stopword at all, common English
        // derivational suffixes that essentially never end a Latin headword.
        // Plain single-word nouns like "eye"/"oculus" or "slave"/"servus" have
        // no stopword or suffix to catch — so this adds a direct dictionary
        // check against common English glosses that show up constantly in
        // beginner/intermediate Latin vocab lists. Not exhaustive (no list of
        // English words can be), but covers the common case.
        const COMMON_ENGLISH_WORDS = new Set(['eye','ear','hand','foot','feet','head','king','queen',
            'slave','master','servant','girl','boy','man','woman','child','children','dog','horse',
            'war','peace','love','fear','hope','gift','sword','wall','walls','camp','army','battle',
            'victory','enemy','friend','city','ship','road','gate','wound','blood','death','life',
            'god','goddess','temple','priest','sister','brother','father','mother','son','daughter',
            'home','house','field','forest','wood','mountain','river','sea','island','letter','book',
            'word','name','day','night','year','month','hour','time','money','gold','silver','iron',
            'fire','water','wind','storm','cloud','sun','moon','star','light','dark','tree','bird',
            'fish','sheep','dinner','guest','wine','food','bread','table','chair','door','roof',
            'chariot','spear','shield','soldier','general','senator','consul','citizen','stranger',
            'guard','prisoner','captive','wolf','lion','deer','mouse','apple','wing','arm','leg',
            'mouth','nose','heart','skin','bone','milk','honey','salt','bridge','tower','statue',
            'altar','garden','farm','farmer','sailor','ruler','leader','teacher','student','pupil',
            'doctor','judge','thief','liar','coward','hero','poet','actor','singer','hunter',
            'merchant','trader','beggar','poor','rich','wise','foolish','brave','cowardly','strong',
            'weak','tall','short','small','big','huge','tiny','old','young','new','good','bad',
            'kind','cruel','gentle','harsh','quick','slow','easy','hard']);

        function looksEnglish(s) {
            const t = s.trim();
            if (/\b(to|the|of|is|was|were|be|been|and|who|that|with|not|his|her)\b/i.test(t)) return true;
            if (!t.includes(',') && /(ly|ing|ed|tion|ness|ful|less|ment|able|ible|ous|ive|man|woman)$/i.test(t)) return true;
            if (!t.includes(',') && !t.includes(' ') && COMMON_ENGLISH_WORDS.has(t.toLowerCase())) return true;
            return false;
        }

        function parseVocab() {
            const lines = state.materials.rawText.split('\n');
            state.materials.vocabList = [];
            lines.forEach(line => {
                if (!line.trim()) return;
                const split = splitVocabLine(line);
                if (!split) return;
                let [latin, english] = split;
                // Strip trailing footnote-style digits some PDF extractions glue
                // onto a word (e.g. "neco 1" from a superscript reference marker)
                // — but NOT when it's actually the Anki verb-shorthand conjugation
                // number (e.g. "mitto mittere 3"), which needs to stay intact.
                if (!parseAnkiVerbShorthand(latin)) latin = latin.replace(/\s+\d{1,2}$/, '').trim();
                english = english.replace(/\s+\d{1,2}$/, '').trim();
                if (state.materials.forceSwap) {
                    [latin, english] = [english, latin];
                } else if (looksEnglish(latin) && !looksEnglish(english)) {
                    [latin, english] = [english, latin];
                }
                if (latin && english) {
                    const entry = { latin, english, pos: classifyPos(latin, english), id: Date.now() + Math.random() };
                    // Apply any prior AI enrichment (semantic category, word
                    // associations) for this exact headword, so it survives
                    // vocabList being rebuilt from scratch on every parse.
                    const enrich = state.materials.enrichment[latin];
                    if (enrich) {
                        if (enrich.pos) entry.pos = enrich.pos;
                        if (enrich.semanticCategory) entry.semanticCategory = enrich.semanticCategory;
                        if (Array.isArray(enrich.collocates)) entry.collocates = enrich.collocates;
                    }
                    state.materials.vocabList.push(entry);
                }
            });
            if (state.wordBank.length === 0 && state.materials.vocabList.length > 0) {
                state.wordBank = state.materials.vocabList.map((v, i) => ({
                    ...v, interval: 1, repetitions: 0, ease: 2.5, due: Date.now(), history: []
                }));
            }
        }

        function navigateTo(view) {
            state.view = view;
            render();
            saveState();
        }

        function render() {
            const container = document.getElementById('appContainer');
            switch(state.view) {
                case 'home': container.innerHTML = viewHome(); break;
                case 'daily_launcher': container.innerHTML = viewDailyLauncher(); break;
                case 'practice_select': container.innerHTML = viewPracticeSelect(); break;
                case 'quiz': container.innerHTML = viewQuiz(); attachKeybinds(); break;
                case 'materials': container.innerHTML = viewMaterials(); break;
                case 'wordbank': container.innerHTML = viewWordBank(); break;
                case 'settings': container.innerHTML = viewSettings(); break;
                default: container.innerHTML = viewHome();
            }
        }

        function viewHome() {
            const acc = state.stats.totalAnswered > 0 ? Math.round((state.stats.totalCorrect / state.stats.totalAnswered) * 100) : 100;
            const today = new Date().toDateString();
            if (state.stats.lastStudyDate !== today && state.stats.lastStudyDate !== null) {
                state.stats.completedToday = 0;
                state.stats.lastStudyDate = today;
                saveState();
            }
            
            return `
            <div class="animate-fade-in">
                <div class="mb-8">
                    <h1 class="text-3xl font-classical font-bold text-stone-900 tracking-tight">Practice Dashboard</h1>
                    <p class="text-stone-500 font-serif italic mt-1">Audentes fortuna iuvat.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 sm:gap-8">
                    <div class="md:col-span-7 flex flex-col space-y-6">
                        <button onclick="startDailyLauncher()" class="group text-left bg-sage-500 hover:bg-sage-600 text-white rounded-[2rem] p-8 shadow-lg hover:shadow-xl transition transform hover:-translate-y-1 relative overflow-hidden flex flex-col justify-between min-h-[220px]">
                            <div class="absolute -right-4 -bottom-4 text-sage-400 opacity-30 text-8xl group-hover:scale-110 transition-transform"><i class="fa-solid fa-sun"></i></div>
                            <div class="relative z-10">
                                <span class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block">Daily Custom Mix</span>
                                <h2 class="text-3xl font-classical font-bold mb-2">Daily Practice</h2>
                                <p class="text-sage-100 font-serif max-w-sm text-sm">Choose the order you tackle today's categories. Complete them all at your own pace.</p>
                            </div>
                            <div class="relative z-10 mt-6 font-bold text-sm bg-white text-sage-800 px-5 py-2.5 rounded-xl inline-flex items-center w-max shadow-sm group-hover:bg-sage-50 transition">
                                Start Session <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                            </div>
                        </button>

                        <button onclick="navigateTo('practice_select')" class="group text-left bg-stone-200 hover:bg-stone-300 text-stone-800 rounded-[2rem] p-8 shadow-sm hover:shadow-md transition transform hover:-translate-y-1 relative overflow-hidden flex flex-col justify-between min-h-[180px]">
                            <div class="absolute -right-4 -bottom-4 text-stone-300 opacity-50 text-8xl group-hover:scale-110 transition-transform"><i class="fa-solid fa-layer-group"></i></div>
                            <div class="relative z-10">
                                <span class="bg-stone-300/60 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4 inline-block text-stone-700">Infinite Drills</span>
                                <h2 class="text-2xl font-classical font-bold mb-2">Specific Practice</h2>
                                <p class="text-stone-600 font-serif max-w-sm text-sm">Isolate a specific skill and drill infinitely.</p>
                            </div>
                        </button>
                    </div>

                    <div class="md:col-span-5 bg-sage-300/30 border border-sage-300/50 rounded-[2rem] p-8 flex flex-col justify-between shadow-inner">
                        <div>
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-xl font-classical font-bold text-stone-800"><i class="fa-solid fa-chart-line text-sage-600 mr-2"></i> Statistics</h3>
                                <span class="bg-sage-200 text-sage-800 text-xs px-3 py-1 rounded-full font-bold">Streak: 🔥 ${state.stats.streak}</span>
                            </div>
                            <div class="space-y-4">
                                <div class="bg-white/80 p-5 rounded-2xl border border-stone-200/60 shadow-sm">
                                    <div class="text-xs font-bold text-stone-500 uppercase tracking-wide">All-Time Accuracy</div>
                                    <div class="text-4xl font-bold font-classical text-sage-800 mt-1">${acc}%</div>
                                    <div class="w-full bg-stone-200 h-2 rounded-full mt-3 overflow-hidden">
                                        <div class="bg-sage-500 h-2 rounded-full" style="width: ${acc}%"></div>
                                    </div>
                                </div>
                                <div class="bg-white/80 p-5 rounded-2xl border border-stone-200/60 shadow-sm flex items-center justify-between">
                                    <div>
                                        <div class="text-xs font-bold text-stone-500 uppercase tracking-wide">Daily Progress</div>
                                        <div class="text-xl font-bold text-stone-800 mt-1">${state.stats.completedToday} items</div>
                                    </div>
                                    <div class="w-12 h-12 rounded-full border-4 border-sage-500 flex items-center justify-center text-sage-600 font-bold">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-sage-300/50 text-xs text-stone-600 flex justify-between items-center">
                            <span>Word Bank: ${state.wordBank.length} cards</span>
                            <span>Materials: ${state.materials.vocabList.length} parsed</span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function viewDailyLauncher() {
            const dm = state.settings.dailyMix;
            const typeMeta = {
                vocab: { name: 'Vocabulary Recall', icon: 'fa-book-open', color: 'sage' },
                declining: { name: 'Declining', icon: 'fa-list-ol', color: 'sage' },
                conjugation: { name: 'Conjugation', icon: 'fa-font', color: 'sage' },
                genderCase: { name: 'Number / Gender / Case', icon: 'fa-shapes', color: 'sage' },
                principalParts: { name: 'Principal Parts', icon: 'fa-font', color: 'sage' },
                latToEng: { name: 'Latin to English', icon: 'fa-language', color: 'sage' },
                engToLat: { name: 'English to Latin', icon: 'fa-pen-nib', color: 'terracotta' },
                latSentence: { name: 'Latin to English Sentences', icon: 'fa-align-left', color: 'sage' },
                engSentence: { name: 'English to Latin Sentences', icon: 'fa-align-left', color: 'terracotta' },
                moodTenseVoice: { name: 'Mood / Tense / Voice', icon: 'fa-clock-rotate-left', color: 'sage' },
                unseen: { name: 'Unseen Practice', icon: 'fa-file-lines', color: 'sage' },
            };
            
            const enabled = Object.keys(dm).filter(k => k !== 'countPerType' && dm[k]);
            const completed = state.dailyLauncher.completed;
            const allDone = enabled.length > 0 && enabled.every(e => completed.includes(e));
            const remaining = enabled.filter(e => !completed.includes(e));

            if (state.dailyLauncher.generating) {
                return `

                        </p>
                        <div class="flex gap-2 flex-wrap justify-center">
                            ${remaining.map(k => {
                                const m = typeMeta[k];

        function viewPracticeSelect() {
            const modes = [
                { id: 'vocab', name: 'Vocabulary Recall', icon: 'fa-book-open', desc: 'Type the translation', color: 'sage' },
                { id: 'declining', name: 'Declining', icon: 'fa-list-ol', desc: 'Noun declensions', color: 'sage' },
                { id: 'conjugation', name: 'Conjugation', icon: 'fa-font', color: 'sage', desc: 'Verb forms' },

                { id: 'principalParts', name: 'Principal Parts', icon: 'fa-font', desc: 'Verb principal parts', color: 'sage' },
                { id: 'latToEng', name: 'Latin to English', icon: 'fa-language', desc: 'Translate phrases', color: 'sage' },
                { id: 'engToLat', name: 'English to Latin', icon: 'fa-pen-nib', desc: 'Verb-last composition', color: 'terracotta' },

        function viewQuiz() {
            const q = state.quiz.questions[state.quiz.index];
            if (!q) return `<div class="text-center p-10">Loading...</div>`;

            const badges = {
                vocab: 'Vocabulary Recall',
                declining: 'Declining',
                conjugation: 'Conjugation',
                genderCase: 'Number / Gender / Case',
                principalParts: 'Principal Parts',
                latToEng: 'Latin to English Phrase',
                engToLat: 'English to Latin Phrase',
                latSentence: 'Latin to English Sentence',
                engSentence: 'English to Latin Sentence',
                moodTenseVoice: 'Mood / Tense / Voice',
                unseen: 'Unseen Passage'
            };

            return viewTypedQuiz(q, badges[q.type] || q.type);
        }

        function viewTypedQuiz(q, badge) {
            const isEngLat = q.type === 'engToLat' || q.type === 'engSentence';
            const isVocab = q.type === 'vocab';
            const isDecl = q.type === 'declining';
            const isConj = q.type === 'conjugation';
            return `
            <div class="max-w-3xl mx-auto animate-fade-in w-full py-4 flex flex-col justify-center min-h-[70vh]">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="${state.dailyLauncher.active ? 'backToLauncher()' : 'navigateTo(\'home\')'}" class="text-stone-500 hover:text-stone-800 bg-white border border-stone-200 w-10 h-10 rounded-full flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="text-xs font-bold text-stone-400 uppercase tracking-widest">
                        ${state.dailyLauncher.active ? 'Daily Mix' : (state.quiz.isInfinite ? 'Infinite Practice' : 'Practice')}
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-8 sm:p-12 shadow-xl border border-stone-100 flex flex-col items-center justify-center text-center space-y-8 relative overflow-hidden">

                        <span class="bg-sage-100 text-sage-800 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full border border-sage-200 inline-block">${badge}</span>
                        ${q.source === 'fallback' ? '<span class="text-[10px] text-stone-400 uppercase tracking-widest" title="No AI configured, or the AI call failed — this is a fixed offline template, not freshly generated.">offline template</span>' : (q.source === 'ai' ? '<span class="text-[10px] text-stone-300 uppercase tracking-widest">AI-generated</span>' : '')}

                    <div class="w-full pt-4">
                        ${isVocab || isDecl || isConj ? renderVocabInput() : renderStandardInput()}
                        ${isEngLat ? '<div class="text-[10px] text-stone-400 font-medium text-left italic mt-2"><i class="fa-solid fa-thumbtack mr-1"></i>Remember: your teacher requires the verb to go at the end of the sentence.</div>' : ''}
                    </div>

                    <div id="feedbackBox" class="w-full hidden text-left bg-parchment-100 border border-stone-200 rounded-2xl p-6 mt-4 animate-fade-in"></div>

                    <button id="submitBtn" onclick="evaluateAnswer()" class="w-full sm:w-auto px-10 py-4 bg-sage-600 hover:bg-sage-700 text-white font-bold rounded-xl shadow-lg transition text-lg mt-4">
                        Submit
                    </button>
                    <div class="text-[10px] text-stone-400 font-medium italic"><i class="fa-solid fa-keyboard mr-1"></i> Press Enter to submit. If you don't know, press Enter to reveal, then Enter again to skip.</div>
                </div>
            </div>`;
        }

        function renderStandardInput() {
            return `<textarea id="ans_standard" rows="3" class="w-full bg-stone-50 border-2 border-stone-200 rounded-2xl p-5 text-xl font-serif text-center focus:outline-none focus:border-sage-400 focus:bg-white shadow-inner resize-none custom-scrollbar" placeholder="Type your answer..."></textarea>`;

            return `<input type="text" id="ans_vocab" class="w-full bg-stone-50 border-2 border-stone-200 rounded-2xl p-5 text-2xl font-serif text-center focus:outline-none focus:border-sage-400 focus:bg-white shadow-inner" placeholder="Type your answer...">`;

        function viewMaterials() {

                        <h1 class="text-3xl font-classical font-bold text-stone-800">My Materials</h1>

                                <i class="fa-solid fa-image mr-1"></i> Image

                                <p id="enrichStatus" class="text-[11px] text-stone-400 mt-2">${Object.keys(state.materials.enrichment).length > 0 ? `${Object.keys(state.materials.enrichment).length} words indexed so far.` : 'One-time pass: tags each word (person/place/object/etc.) and links related words (e.g. "conicio" ↔ "saxum"), so offline-generated sentences pick sensible pairings instead of random ones. Costs one small API call per ~25 words, not per question — re-run after adding a lot of new vocab.'}</p>
                            </div>
                        </div>
                        
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                            <h3 class="font-classical font-bold text-lg mb-3">Uploaded Images (${state.materials.images.length})</h3>
                            <div class="grid grid-cols-4 gap-2 max-h-[200px] overflow-y-auto custom-scrollbar">
                                ${state.materials.images.map((img, i) => `

        // ==================== DAILY LAUNCHER LOGIC ====================

        function todayKey() {
            return new Date().toDateString();

        async function applyDailyFocus() {
            const val = document.getElementById('focusInput').value.trim();
            if (!val) return;
            state.dailyLauncher.focusTopic = val;
            await startDailyLauncher();
        }

        async function clearDailyFocus() {
            state.dailyLauncher.focusTopic = '';
            await startDailyLauncher();
        }

        async function startDailyLauncher() {
            const dm = state.settings.dailyMix;
            const enabled = Object.keys(dm).filter(k => k !== 'countPerType' && dm[k]);
            
            if (enabled.length === 0) {
                alert('Enable at least one category in Settings > Daily Mix.');
                return navigateTo('settings');
            }

            const focusTopic = state.dailyLauncher.focusTopic || '';
            state.dailyLauncher = {
                active: true,
                completed: [],
                currentType: null,
                enabledTypes: enabled,
                results: [],
                generating: false,
                focusTopic
            };

            // Same calendar day, same focus topic, and every enabled type
            // already generated? Reuse it — this is what avoids hitting the
            // API again today.
            const cacheValid = state.dailyCache.date === todayKey()
                && (state.dailyCache.focusTopic || '') === focusTopic
                && enabled.every(t => state.dailyCache.questionsByType[t]);

            if (!cacheValid) {
                // New day (or focus changed, or newly-enabled category, or
                // materials changed since last generation) — regenerate just
                // the missing types.
                state.dailyLauncher.generating = true;
                saveState();
                navigateTo('daily_launcher');

                if (state.dailyCache.date !== todayKey() || (state.dailyCache.focusTopic || '') !== focusTopic) {
                    state.dailyCache = { date: todayKey(), focusTopic, questionsByType: {} };
                }
                for (const type of enabled) {
                    if (state.dailyCache.questionsByType[type]) continue;
                    try {
                        state.dailyCache.questionsByType[type] = await generateQuestions(type, state.settings.dailyMix.countPerType);
                    } catch(e) {
                        console.warn('Daily mix generation failed for', type, e);
                        state.dailyCache.questionsByType[type] = await generateQuestions(type, state.settings.dailyMix.countPerType);
                    }
                    // Small gap between calls so a multi-category daily mix
                    // doesn't fire a burst of requests that trips a per-minute
                    // rate limit on the free tier.
                    await new Promise(r => setTimeout(r, 1200));
                }
                state.dailyLauncher.generating = false;
            }

            saveState();
            navigateTo('daily_launcher');
        }

        async function startDailyCategory(type) {
            state.dailyLauncher.currentType = type;
            state.quiz.isInfinite = false;
            state.quiz.index = 0;
            state.quiz.answered = false;
            state.quiz.results = [];
            // Pull from today's pre-generated cache; only hit the API directly
            // if something's missing from it (shouldn't normally happen).
            state.quiz.questions = state.dailyCache.questionsByType[type]
                || await generateQuestions(type, state.settings.dailyMix.countPerType);
            saveState();
            navigateTo('quiz');
        }

        function backToLauncher() {

        function finishDailyCategory() {
            const type = state.dailyLauncher.currentType;
            if (type && !state.dailyLauncher.completed.includes(type)) {
                state.dailyLauncher.completed.push(type);
            }
            if (state.quiz.results) {
                state.dailyLauncher.results = state.dailyLauncher.results || [];
                state.dailyLauncher.results.push(...state.quiz.results);
            }
            state.dailyLauncher.currentType = null;
            saveState();
            navigateTo('daily_launcher');
        }

        // Pulls vocabulary straight out of Style Examples sentence pairs (which
        // already have both Latin and English, so no guessing needed) and adds
        // any genuinely new words to the corpus. Skips re-running when the
        // examples text hasn't changed since the last pass, so this doesn't
        // burn API calls re-scanning unchanged content on every save.
        async function extractVocabFromExamples() {
            const examples = state.materials.styleExamples;
            if (!examples || !examples.trim()) return;
            if (!state.settings.apiKey || !state.settings.apiUrl) return;
            if (state.materials.lastExtractedExamples === examples) return; // unchanged

            const statusEl = document.getElementById('enrichStatus');
            if (statusEl) statusEl.textContent = 'Scanning style examples for new vocab...';

            const existingHeadwords = new Set(state.materials.vocabList.map(v => v.latin.split(',')[0].trim().toLowerCase()));
            const prompt = `Below are Latin example sentences paired with their English translations. Identify the NOTEWORTHY vocabulary (nouns, verbs, adjectives, useful adverbs/prepositions) used in them — skip trivial words already assumed known (basic pronouns like is/ea/id, and/but conjunctions like et/sed, the relative qui/quae/quod).

For each word, give its Latin DICTIONARY form in standard vocab-list convention (nouns: nominative + genitive, e.g. "miles, militis"; verbs: principal parts, e.g. "mitto, mittere, misi, missus"; adjectives: "bonus, -a, -um") and its English meaning, based on how it's used in these sentences — not just any dictionary sense.

Sentences:
${examples.substring(0, 4000)}

Return ONLY JSON: {"vocab": ["latin dictionary form - english meaning", ...]}`;
            try {
                const result = await callAI(prompt, true);
                if (result && Array.isArray(result.vocab)) {
                    const newLines = [];
                    result.vocab.forEach(line => {
                        if (typeof line !== 'string') return;
                        const split = splitVocabLine(line);
                        if (!split) return;
                        const headword = split[0].split(',')[0].trim().toLowerCase();
                        if (headword && !existingHeadwords.has(headword)) {
                            existingHeadwords.add(headword);
                            newLines.push(line);
                        }
                    });
                    if (newLines.length > 0) {
                        state.materials.rawText += `\n\n--- from Style Examples ---\n` + newLines.join('\n');
                        const area = document.getElementById('rawInputArea');
                        if (area) area.value = state.materials.rawText;
                        parseVocab();
                        if (statusEl) statusEl.textContent = `Added ${newLines.length} new word(s) from style examples.`;
                    } else if (statusEl) {
                        statusEl.textContent = 'No new vocab found in style examples.';
                    }
                }
            } catch(e) {
                console.warn('Vocab extraction from examples failed', e);
            }
            state.materials.lastExtractedExamples = examples;
            saveState();
        }

        function saveMaterials() {
            state.materials.rawText = document.getElementById('rawInputArea').value;
            const gArea = document.getElementById('grammarInputArea');
            if (gArea) state.materials.grammarNotes = gArea.value;
            const eArea = document.getElementById('styleExamplesArea');
            if (eArea) state.materials.styleExamples = eArea.value;
            parseVocab();
            // New/changed materials mean anything already cached for today no
            // longer reflects them — clear it so the next daily mix (or next
            // category opened) regenerates from the updated content.
            state.dailyCache = { date: null, questionsByType: {} };
            saveState();
            render();
            runAutoPipeline(); // fire-and-forget — extracts new vocab from examples, then indexes everything new
        }

        async function runAutoPipeline() {

        // Manual "Sort with AI" button: runs the same vocab/grammar split used
        // for PDF uploads on whatever's currently pasted into the corpus box —
        // for when a grammar sheet gets pasted as text rather than uploaded.
        async function autoSortCorpus() {
            if (!state.settings.apiKey || !state.settings.apiUrl) {
                alert('Add an API key in Settings first — sorting vocab from grammar needs the AI.');
                return;
            }
            const btn = document.getElementById('sortBtn');
            const area = document.getElementById('rawInputArea');
            const original = area.value;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Sorting...`;
            try {
                const sorted = await sortMaterialWithAI(original, 'pasted corpus');
                area.value = sorted.vocab.join('\n');
                if (sorted.grammar.trim()) {
                    const gArea = document.getElementById('grammarInputArea');
                    const combined = (state.materials.grammarNotes ? state.materials.grammarNotes + '\n\n' : '') + sorted.grammar.trim();
                    state.materials.grammarNotes = combined;
                    if (gArea) gArea.value = combined;
                }
                if (sorted.examples && sorted.examples.trim()) {
                    const eArea = document.getElementById('styleExamplesArea');
                    const combinedEx = (state.materials.styleExamples ? state.materials.styleExamples + '\n\n' : '') + sorted.examples.trim();
                    state.materials.styleExamples = combinedEx;
                    if (eArea) eArea.value = combinedEx;
                }
                saveMaterials();
            } catch(e) {
                alert('AI sorting failed: ' + e.message);
            }
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Sort with AI`;
        }

        // Modern Anki (2.1.50+, i.e. basically every export today) stores the real
        // deck data in a zstd-compressed collection.anki21b file, and keeps
        // collection.anki2 around only as an empty/placeholder stub for very old
        // Anki versions. Reading collection.anki2 directly (the old approach) picks
        // up that empty stub, which is why cards silently failed to import.
        async function getCollectionBytes(zip) {
            if (zip.file("collection.anki21b")) {
                const raw = await zip.file("collection.anki21b").async("uint8array");
                if (typeof fzstd === 'undefined') {
                    throw new Error("Couldn't load the zstd decompressor (fzstd) — check your internet connection.");
                }
                return fzstd.decompress(raw);
            }
            if (zip.file("collection.anki21")) {
                return await zip.file("collection.anki21").async("uint8array");
            }
            if (zip.file("collection.anki2")) {
                return await zip.file("collection.anki2").async("uint8array");
            }
            throw new Error("No collection database found inside this .apkg file.");
        }

        async function handleFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const textarea = document.getElementById('rawInputArea');

            if (type === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let rawExtracted = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    rawExtracted += content.items.map(item => item.str).join(' ') + '\n';
                }

                const avgCharsPerPage = rawExtracted.trim().length / pdf.numPages;
                if (avgCharsPerPage < 20) {
                    alert(`This PDF looks like a scanned image with little to no selectable text (~${Math.round(avgCharsPerPage)} characters/page extracted). Text extraction can't read scanned pages — try exporting a text-based PDF, or paste/retype the content directly into the corpus box instead.`);
                    event.target.value = '';
                    return;
                }

                await sortAndInsertMaterial(rawExtracted, file.name, textarea);
            } else if (type === 'apkg') {
                try {
                    const zip = await JSZip.loadAsync(file);
                    const dbFile = await getCollectionBytes(zip);
                    const SQL = await initSqlJs({ locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` });
                    const db = new SQL.Database(dbFile);
                    const res = db.exec("SELECT flds FROM notes");
                    let text = `\n\n--- APKG: ${file.name} ---\n`;
                    let cardCount = 0;
                    if (res.length > 0) {
                        res[0].values.forEach(val => {
                            const fields = val[0].split('\x1f');
                            if (fields.length >= 2) {
                                const lat = fields[0].replace(/<[^>]*>?/gm, '').trim();
                                const eng = fields[1].replace(/<[^>]*>?/gm, '').trim();
                                if (lat && eng) { text += `${lat} - ${eng}\n`; cardCount++; }
                            }
                        });
                    }
                    if (cardCount === 0) {
                        alert('No flashcards were found inside this .apkg file. It may use a note type this parser can\'t read, or be empty.');
                    }
                    textarea.value += text;
                } catch(e) {
                    console.error(e);
                    alert('Error parsing APKG: ' + e.message);
                }
            } else if (type === 'image') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.materials.images.push(e.target.result);
                    saveState();
                    render();
                };
                reader.readAsDataURL(file);
                return;
            }
            event.target.value = '';
        }

        function removeImage(idx) {
            state.materials.images.splice(idx, 1);
            saveState();
            render();
        }

        function addWordBank() {
            const lat = document.getElementById('wbLatin').value.trim();
            const eng = document.getElementById('wbEnglish').value.trim();
            if (!lat || !eng) return;

        function syncWordBank() {
            parseVocab();

            state.materials.vocabList.forEach(v => {
                if (!existing.has(v.latin)) {
                    state.wordBank.push({
                        latin: v.latin, english: v.english, id: Date.now() + Math.random(),
                        interval: 1, repetitions: 0, ease: 2.5, due: Date.now(), history: []

            saveState();
            render();

        function filterWordBank() {

        async function testConnection() {
            // Test with whatever's currently in the fields, even if not saved
            // yet — so the user can check before committing to Save.
            const key = document.getElementById('cfg_key').value;
            const url = document.getElementById('cfg_url').value;
            const model = document.getElementById('cfg_model').value;
            const btn = document.getElementById('testConnBtn');
            const resultEl = document.getElementById('testConnResult');
            if (!key || !url) {
                resultEl.innerHTML = '<span class="text-terracotta-600">Enter an API key and URL first.</span>';
                return;
            }
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Testing...';
            resultEl.innerHTML = '';
            try {
                const res = await fetch(`${url}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({ model, messages: [{ role: 'user', content: 'Reply with just the word OK.' }], max_tokens: 5 })
                });
                if (res.ok) {
                    resultEl.innerHTML = '<span class="text-sage-700"><i class="fa-solid fa-check-circle mr-1"></i>Connected — this model and key are working.</span>';
                } else if (res.status === 429) {
                    resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Rate limited (429) — the key/URL work, but you\'ve hit the provider\'s request limit for now. Try again shortly.</span>';
                } else if (res.status === 401 || res.status === 403) {
                    resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Auth error (' + res.status + ') — check the API key is correct and active.</span>';
                } else {
                    resultEl.innerHTML = `<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Request failed (${res.status}) — check the API URL and model name.</span>`;
                }
            } catch(e) {
                resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Network error — check the API URL is reachable.</span>';
            }
            btn.disabled = false;
            btn.textContent = originalText;
        }

        function saveSettings() {

            ['vocab','declining','conjugation','genderCase','principalParts','latToEng','engToLat','latSentence','engSentence','moodTenseVoice','unseen'].forEach(k => {
                state.settings.dailyMix[k] = document.getElementById('dm_' + k).checked;
            });
