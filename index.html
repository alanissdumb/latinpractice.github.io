        }

        // Approximates real Latin morphology (no macrons, so 2nd vs 3rd conj
        // "-ere" verbs aren't distinguishable by spelling alone) — good enough
        // for practice purposes, but the previous version didn't even look at
        // the word: it returned the same fixed example paradigm regardless of
        // what was asked, which is its own version of the noun/verb confusion.
        // The genitive is what actually identifies the declension and gives
        // the stem — reading it properly is the only reliable way. The old
        // version only recognised a genitive ending in "-is", so a perfectly
        // ordinary 2nd-declension entry like "liber, libri" fell through to
        // the 3rd-declension guess and produced "liberem, liberis, libere"
        // instead of "librum, libri, libro".
        function getDeclension(latinEntry) {
            const parts = latinEntry.split(',').map(x => x.trim());
            const nom = parts[0];
            const gen = (parts[1] && !parts[1].startsWith('-')) ? parts[1] : '';
            const g = gen.toLowerCase();
            const w = nom.toLowerCase();
            // "-ius" nouns take a contracted vocative (filius -> fili).
            const voc = /ius$/i.test(nom) ? nom.slice(0, -2)
                      : /us$/i.test(nom) ? nom.slice(0, -2) + 'e'
                      : nom;

            if (gen) {
                if (/ae$/.test(g)) {                      // 1st
                    const st = gen.slice(0, -2);
                    return [nom, nom, st + 'am', gen, gen, st + 'a'];
                }
                if (/es$/.test(w) && /ei$/.test(g)) {     // 5th (res, dies)
                    const st = gen.slice(0, -2);
                    return [nom, nom, st + 'em', gen, gen, st + 'e'];
                }
                if (/us$/.test(g) && /(us|u)$/.test(w)) { // 4th (manus, senatus)
                    const st = gen.slice(0, -2);
                    return [nom, nom, st + 'um', gen, st + 'ui', st + 'u'];
                }
                if (/i$/.test(g)) {                       // 2nd
                    const st = gen.slice(0, -1);
                    if (/um$/i.test(nom)) return [nom, nom, nom, gen, st + 'o', st + 'o'];
                    return [nom, voc, st + 'um', gen, st + 'o', st + 'o'];
                }
                if (/is$/.test(g)) {                      // 3rd
                    const st = gen.slice(0, -2);
                    // Common 3rd-declension neuters (flumen/fluminis,
                    // corpus/corporis) keep the nominative in the accusative.
                    const neuter = /men$/i.test(nom) || (/us$/i.test(nom) && /(or|er)is$/i.test(gen)) || /(al|ar|e)$/i.test(nom);
                    return [nom, nom, neuter ? nom : st + 'em', gen, st + 'i', st + 'e'];
                }
            }

            // No genitive given — fall back to the nominative's shape.
            if (/a$/.test(w))  { const st = nom.slice(0, -1); return [nom, nom, st + 'am', st + 'ae', st + 'ae', st + 'a']; }
            if (/us$/.test(w)) { const st = nom.slice(0, -2); return [nom, voc, st + 'um', st + 'i', st + 'o', st + 'o']; }
            if (/um$/.test(w)) { const st = nom.slice(0, -2); return [nom, nom, nom, st + 'i', st + 'o', st + 'o']; }
            if (/er$/.test(w)) { const st = nom.slice(0, -2) + 'r'; return [nom, nom, st + 'um', st + 'i', st + 'o', st + 'o']; }
            // 3rd-declension adjectives/nouns cited as just "fortis"/"omnis" —
            // without this the fallback appended to the whole word and gave
            // "fortisem" instead of "fortem".
            if (/is$/.test(w)) { const st = nom.slice(0, -2); return [nom, nom, st + 'em', nom, st + 'i', st + 'i']; }
            return [nom, nom, nom + 'em', nom + 'is', nom + 'i', nom + 'e'];
        }

        function getConjugation(latinEntry) {
            // If this is "present infinitive conjNumber" shorthand, the number
            // tells us the conjugation directly — no need to guess from spelling.
            const shorthand = parseAnkiVerbShorthand(latinEntry);
            if (shorthand) {
                const stem = shorthand.infinitive.slice(0, -3); // strip -are/-ere/-ire
                if (shorthand.conj === '1') return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
                if (shorthand.conj === '2') return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
                if (shorthand.conj === '4') return [stem + 'ior', stem + 'iris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'iuntur'];
                // conj 3 (including 3rd-io) — endings are the same passive
                // present pattern either way
                return [stem + 'or', stem + 'eris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'untur'];
            }

            // Vocab is often given as full principal parts (e.g. "amo, amare,
            // amavi, amatum") — the infinitive (2nd part) reliably identifies
            // the conjugation class; the 1st person alone doesn't.
            const parts = latinEntry.split(',').map(s => s.trim());
            const inf = (parts.length >= 2 ? parts[1] : parts[0]).toLowerCase();
            if (inf.endsWith('are')) { // 1st conjugation, regular active (e.g. "amare")
                const stem = inf.slice(0, -3);
                return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
            }
            if (inf.endsWith('ari')) { // 1st conjugation deponent (e.g. "hortari")
                const stem = inf.slice(0, -3);
                return [stem + 'or', stem + 'aris', stem + 'atur', stem + 'amur', stem + 'amini', stem + 'antur'];
            }
            if (inf.endsWith('eri')) { // 2nd conjugation deponent (e.g. "vereri")
                const stem = inf.slice(0, -3);
                return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
            }
            if (inf.endsWith('ire')) { // 4th conjugation
                const stem = inf.slice(0, -3);
                return [stem + 'ior', stem + 'iris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'iuntur'];
            }
            if (inf.endsWith('ere')) {
                const stem = inf.slice(0, -3);
                // 2nd and 3rd conjugation both end "-ere" without macrons, but
                // inflect differently. The 1st principal part reliably tells
                // them apart: 2nd conj is "-eo" (timeo/video/habeo), 3rd is a
                // consonant + "-o" (mitto/dico/duco).
                if (/eo$/i.test(parts[0])) {
                    return [stem + 'eor', stem + 'eris', stem + 'etur', stem + 'emur', stem + 'emini', stem + 'entur'];
                }
                return [stem + 'or', stem + 'eris', stem + 'itur', stem + 'imur', stem + 'imini', stem + 'untur'];
            }
            // Fallback: treat the first part as an already-inflected stem
            const stem = parts[0].replace(/o$/, '');
            return [stem + 'or', stem + 'ris', stem + 'tur', stem + 'mur', stem + 'mini', stem + 'ntur'];
        }

        // Shared helper for every AI call in the app. Both question generation
        // and answer marking used to duplicate this fetch — now there's one
        // place to fix if the API shape ever changes (e.g. switching providers).
        // Set jsonMode=true to request/parse a JSON object response.
        // Strips any trailing slash(es) so appending "/chat/completions" never
        // produces a double slash — LM Studio (and possibly other local
        // servers) doesn't recognize "/v1//chat/completions" as a valid route
        // and silently returns junk with a 200 status instead of erroring.
        function normalizeApiUrl(url) {
            return (url || '').trim().replace(/\/+$/, '');
        }

        // A local server (LM Studio, Ollama, llama.cpp) has NO API key — it
        // accepts any Authorization header, or none. Requiring a key here is
        // what made every local-AI attempt silently fall through to the
        // offline templates: callAI returned null before even trying, so it
        // looked exactly like "offline mode" with no error anywhere.
        // A URL is the only thing genuinely required.
        function guessProfileName(url, model) {
            if (isLocalUrl(url)) return (model || 'local').split('/').pop();
            if (/generativelanguage/.test(url)) return model || 'Gemini';
            if (/openai\.com/.test(url)) return model || 'OpenAI';
            return (model || url.replace(/^https?:\/\//, '')).slice(0, 24);
        }

        function activeProfile() {
            const list = state.settings.profiles || [];
            return list.find(p => p.id === state.settings.activeProfileId) || list[0] || null;
        }

        // Switching copies the profile into the live apiKey/apiUrl/model
        // fields, so nothing else in the app needs to know profiles exist.
        function switchProfile(id) {
            const p = (state.settings.profiles || []).find(x => x.id === id);
            if (!p) return;
            state.settings.activeProfileId = p.id;
            state.settings.apiKey = p.apiKey;
            state.settings.apiUrl = p.apiUrl;
            state.settings.model = p.model;
            saveState();
            render();
        }

        function saveCurrentAsProfile() {
            const key = document.getElementById('cfg_key').value;
            const url = normalizeApiUrl(document.getElementById('cfg_url').value);
            const model = document.getElementById('cfg_model').value.trim();
            if (!url) { alert('Enter an API URL first.'); return; }
            const nameEl = document.getElementById('cfg_profile_name');
            const name = (nameEl && nameEl.value.trim()) || guessProfileName(url, model);
            state.settings.profiles = state.settings.profiles || [];
            // Same URL + model = the same connection; update rather than
            // accumulate near-duplicates.
            const existing = state.settings.profiles.find(p => p.apiUrl === url && p.model === model);
            if (existing) {
                existing.name = name; existing.apiKey = key;
                state.settings.activeProfileId = existing.id;
            } else {
                const p = { id: 'p' + Date.now(), name, apiKey: key, apiUrl: url, model };
                state.settings.profiles.push(p);
                state.settings.activeProfileId = p.id;
            }
            state.settings.apiKey = key; state.settings.apiUrl = url; state.settings.model = model;
            saveState();
            render();
        }

        function deleteProfile(id) {
            state.settings.profiles = (state.settings.profiles || []).filter(p => p.id !== id);
            if (state.settings.activeProfileId === id) {
                const first = state.settings.profiles[0];
                state.settings.activeProfileId = first ? first.id : null;
                if (first) { state.settings.apiKey = first.apiKey; state.settings.apiUrl = first.apiUrl; state.settings.model = first.model; }
            }
            saveState();
            render();
        }

        function aiConfigured() {
            return !!(state.settings.apiUrl && state.settings.apiUrl.trim());
        }

        function isLocalUrl(url) {
            return /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|192\.168\.|10\.)/i.test((url || '').trim());
        }

        function buildAuthHeaders(key) {
            const h = { 'Content-Type': 'application/json' };
            // Only send Authorization when there's actually a key — some local
            // servers reject "Bearer " with an empty value outright.
            if (key && key.trim()) h['Authorization'] = `Bearer ${key.trim()}`;
            return h;
        }

        async function postChat(conn, body, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(`${normalizeApiUrl(conn.apiUrl)}/chat/completions`, {
                    method: 'POST',
                    headers: buildAuthHeaders(conn.apiKey),
                    body: JSON.stringify(body),
                    signal: controller.signal
                });
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // One attempt against one specific connection.
        async function callAIWith(conn, prompt, jsonMode) {
            const local = isLocalUrl(conn.apiUrl);
            // Local models are much slower to first token, especially on a
            // cold load — 60s was short enough to time out mid-generation.
            const timeoutMs = local ? 180000 : 60000;
            const base = { model: conn.model, messages: [{ role: 'user', content: prompt }] };
            const body = { ...base };
            if (jsonMode) body.response_format = { type: 'json_object' };

            let res;
            try {
                res = await postChat(conn, body, timeoutMs);
            } catch(e) {
                if (e.name === 'AbortError') throw new Error(`timed out after ${timeoutMs / 1000}s`);
                if (local) throw new Error("couldn't reach the local server (is it running, is CORS on, did you open this as a file rather than https?)");
                throw e;
            }

            // Not every OpenAI-compatible server implements response_format.
            // Ollama and some llama.cpp builds 400 on it — which used to look
            // like a total failure. Retry once as a plain request; extractJson
            // is already tolerant of fences/preamble, so the result is fine.
            if (!res.ok && jsonMode && (res.status === 400 || res.status === 422 || res.status === 404)) {
                console.warn(`Server rejected response_format (${res.status}) — retrying without it.`);
                res = await postChat(conn, { ...base, messages: [{ role: 'user', content: prompt + '\n\nIMPORTANT: reply with raw JSON only. No markdown fences, no commentary.' }] }, timeoutMs);
            }

            if (!res.ok) {
                let detail = '';
                try { detail = (await res.text()).slice(0, 160); } catch(e) {}
                throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
            }
            const data = await res.json();
            if (!data.choices || !data.choices[0] || !data.choices[0].message) throw new Error('unexpected response shape (does the model name match what the server reports at /v1/models?)');
            const content = data.choices[0].message.content;
            if (jsonMode) return extractJson(content);
            return content;
        }

        // Which connection actually answered the last successful call. Shown
        // on the question card — without it, failover would quietly make it
        // impossible to tell which model wrote a given sentence, which is
        // exactly the thing being compared.
        let lastUsedProfileName = '';

        async function callAI(prompt, jsonMode) {
            if (!aiConfigured()) return null;
            const active = activeProfile() || { name: guessProfileName(state.settings.apiUrl, state.settings.model),
                apiKey: state.settings.apiKey, apiUrl: state.settings.apiUrl, model: state.settings.model };
            const others = state.settings.autoFallback
                ? (state.settings.profiles || []).filter(p => p.id !== (activeProfile() || {}).id && p.apiUrl)
                : [];
            const chain = [active, ...others];

            const errors = [];
            for (let i = 0; i < chain.length; i++) {
                const conn = chain[i];
                try {
                    const result = await callAIWith(conn, prompt, jsonMode);
                    lastUsedProfileName = conn.name || guessProfileName(conn.apiUrl, conn.model);
                    if (i > 0) {
                        // Falling back silently would hide both the failure and
                        // the fact that a different model answered.
                        lastAiError = `${chain[0].name || 'primary'} failed (${errors[0]}) — answered by ${lastUsedProfileName} instead.`;
                        console.warn(lastAiError);
                    } else {
                        lastAiError = '';
                    }
                    return result;
                } catch(e) {
                    const msg = e.message || String(e);
                    errors.push(msg);
                    console.warn(`Connection "${conn.name || conn.apiUrl}" failed: ${msg}`);
                }
            }
            throw new Error(chain.length > 1
                ? `All ${chain.length} connections failed. ${chain.map((c, i) => `${c.name || c.apiUrl}: ${errors[i]}`).join(' | ')}`
                : errors[0] || 'AI request failed');
        }

        // Local open models are noticeably less reliable than hosted ones at
        // strictly returning ONLY valid JSON, even when explicitly told to —
        // common patterns: wrapping it in ```json fences, prefacing it with
        // "Sure, here's the JSON:", or (for Qwen3.x-style thinking models)
        // emitting a <think>...</think> reasoning block before the answer.
        // This tries several strategies before giving up.
        function extractJson(content) {
            if (content === null || content === undefined) throw new Error('AI returned an empty message');
            let text = String(content).trim();
            // Strip a <think>...</think> reasoning block if present. Some
            // models emit an unclosed one when they hit the token limit, so
            // handle that too rather than leaving the whole response wrapped.
            text = text.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
            text = text.replace(/^[\s\S]*?<\/think>/i, '').trim();
            text = text.replace(/<think>[\s\S]*$/i, '').trim();
            // Strip markdown code fences if the whole thing is wrapped in one.
            text = text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
            try {
                return JSON.parse(text);
            } catch(e) {
                // Last resort: grab the outermost {...} substring anywhere in
                // the text and try that — catches cases with a preamble
                // sentence before or trailing commentary after the JSON.
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if (start !== -1 && end > start) {
                    try {
                        return JSON.parse(text.slice(start, end + 1));
                    } catch(e2) {
                        console.warn('Could not parse AI response as JSON. Raw content:', content);
                        throw new Error('AI response was not valid JSON (see console for raw content)');
                    }
                }
                console.warn('Could not parse AI response as JSON. Raw content:', content);
                throw new Error('AI response was not valid JSON (see console for raw content)');
            }
        }

        // Shared by PDF upload and the manual "Sort with AI" button: takes raw
        // extracted/pasted text, splits it via AI into vocab vs grammar, and
        // writes each into the right box. Falls back to dumping raw text into
        // the vocab box (with a warning) if no AI is configured yet.
        async function sortAndInsertMaterial(rawText, sourceLabel, textareaEl) {
            if (!aiConfigured()) {
                alert(`No AI configured yet, so "${sourceLabel}" is being added as raw text — if it's a grammar sheet, this will likely need manual cleanup, or add an API key in Settings first so it can be sorted automatically.`);
                textareaEl.value += `\n\n--- ${sourceLabel} (unsorted — add an AI key for auto-sorting) ---\n${rawText}`;
                return;
            }
            try {
                const sorted = await sortMaterialWithAI(rawText, sourceLabel);
                if (sorted.vocab.length > 0) {
                    textareaEl.value += `\n\n--- ${sourceLabel} (vocab) ---\n` + sorted.vocab.join('\n');
                }
                if (sorted.grammar.trim()) {
                    const gArea = document.getElementById('grammarInputArea');
                    const combined = (state.materials.grammarNotes ? state.materials.grammarNotes + '\n\n' : '') + `--- ${sourceLabel} (grammar) ---\n` + sorted.grammar.trim();
                    state.materials.grammarNotes = combined;
                    if (gArea) gArea.value = combined;
                }
                if (sorted.examples && sorted.examples.trim()) {
                    const eArea = document.getElementById('styleExamplesArea');
                    const combinedEx = (state.materials.styleExamples ? state.materials.styleExamples + '\n\n' : '') + `--- ${sourceLabel} (examples) ---\n` + sorted.examples.trim();
                    state.materials.styleExamples = combinedEx;
                    if (eArea) eArea.value = combinedEx;
                }
                if (sorted.vocab.length === 0 && !sorted.grammar.trim() && !(sorted.examples && sorted.examples.trim())) {
                    textareaEl.value += `\n\n--- ${sourceLabel} (AI found nothing usable, added raw) ---\n${rawText}`;
                }
                state.materials.rawText = textareaEl.value;
                parseVocab();
                saveState();
                runAutoPipeline(); // fire-and-forget — extracts new vocab from examples, then indexes everything new
            } catch(e) {
                console.error(e);
                alert(`AI sorting failed (${e.message}) — adding "${sourceLabel}" as raw text instead. You can sort it manually, or try again once the AI connection is working.`);
                textareaEl.value += `\n\n--- ${sourceLabel} (unsorted, AI sort failed) ---\n${rawText}`;
            }
        }
        // grammar sheets mix in paradigm tables, rules, and example sentences.
        // Feeding that straight into parseVocab() (which splits every line on
        // -/=/: ) turns grammar rules into garbage "vocab" pairs. This asks the
        // AI to separate genuine vocab items from everything else, so grammar
        // content lands in its own notes field instead of the quiz pool.
        // One-time "indexing" pass: asks the AI to tag each word's semantic
        // category (for nouns/adjectives) and suggest which OTHER words in the
        // list it naturally goes with (e.g. "conicio" pairs with "saxum"/"telum";
        // "mitto" pairs with "epistula"/"nuntius"). This runs once (not per
        // question), and the result is cached in state.materials.enrichment —
        // so offline fallback sentences can pick semantically sensible word
        // combinations instead of a random noun in every slot.
        // Shared enrichment worker — indexes whatever word list it's given, in
        // chunks with spacing to avoid rate-limit bursts. Used both by the
        // manual "Index Vocabulary" button (all words) and by the automatic
        // pass after saving materials (only new/unindexed words).
        async function enrichWordList(words, onProgress) {
            const CHUNK = 25;
            const chunks = [];
            for (let i = 0; i < words.length; i += CHUNK) chunks.push(words.slice(i, i + CHUNK));
            let done = 0;
            for (const chunk of chunks) {
                if (onProgress) onProgress(done, words.length);
                const wordList = chunk.map((w, idx) => `${idx + 1}. ${w.latin} (${w.english})`).join('\n');
                const prompt = `You are indexing a Latin vocabulary list for a study app that generates practice sentences offline (without AI). For each word below, provide:
- "pos": "noun", "verb", or "adjective". An ADJECTIVE describes a quality of something (e.g. bonus "good", magnus "great", fortis "brave") — it does not itself name a person, place, or thing.
- "semanticCategory": ONLY for true nouns that name a concrete or abstract THING — one of "person", "place", "object", "animal", "abstract", "nature", "building", "time", "food", "other". Leave this out entirely (do not guess) for verbs AND for adjectives — a quality word like "good" or "great" is not itself a person/place/object, so forcing a category onto it is wrong. Only assign a category when the word genuinely names a thing.
- "collocates": 2-4 OTHER words from THIS SAME LIST that commonly go together with this word in a real sentence — for a verb, nouns from the list that make sense as its subject/object (e.g. "conicio" (I throw) → nouns like "saxum" or "telum" if present in the list; "mitto" (I send) → "epistula" or "nuntius" if present); for an adjective, nouns from the list it could plausibly describe; for a noun, verbs from the list that plausibly act on/with it. Only reference words that actually appear in the list below — if nothing in the list fits well, return an empty array rather than forcing an unrelated word.

Word list:
${wordList}

Return ONLY JSON: {"words": [{"latin": "(exact latin from the list)", "pos": "...", "semanticCategory": "...", "collocates": ["...", "..."]}]}`;
                try {
                    const result = await callAI(prompt, true);
                    if (result && Array.isArray(result.words)) {
                        result.words.forEach(w => {
                            if (w && typeof w.latin === 'string') {
                                // Adjectives used to be rewritten to 'noun' here,
                                // which put them straight back into noun slots.
                                const pos = ['verb', 'noun', 'adjective'].includes(w.pos) ? w.pos : undefined;
                                // Safety net: a semanticCategory only makes sense
                                // for a true noun. If the AI still assigned one
                                // to something it also marked as an adjective,
                                // drop the category rather than keep a wrong one
                                // (this is exactly what happened with "bonus").
                                const semanticCategory = (w.pos === 'noun' && typeof w.semanticCategory === 'string') ? w.semanticCategory : undefined;
                                state.materials.enrichment[w.latin] = {
                                    pos,
                                    semanticCategory,
                                    collocates: Array.isArray(w.collocates) ? w.collocates.filter(c => typeof c === 'string') : []
                                };
                            }
                        });
                    }
                } catch(e) {
                    console.warn('Enrichment chunk failed', e);
                }
                done += chunk.length;
                saveState();
                await new Promise(r => setTimeout(r, 1200)); // avoid a burst of calls
            }
            parseVocab();
            saveState();
        }

        // The "swap every line" checkbox only helps when a list is uniformly
        // backwards. A corpus assembled from several Anki decks is usually
        // mixed, so this asks the AI per line and flips only what's wrong,
        // rewriting the corpus text in place.
        async function fixVocabDirectionWithAI() {
            if (!aiConfigured()) { alert('Set up an AI connection in Settings first.'); return; }
            const entries = state.materials.vocabList;
            if (entries.length === 0) { alert('Nothing parsed yet — save your corpus first.'); return; }
            if (!confirm(`Check the Latin/English order of all ${entries.length} entries and flip the backwards ones? This rewrites your Input Corpus.`)) return;

            const btn = document.getElementById('fixDirBtn');
            const statusEl = document.getElementById('fixDirStatus');
            if (btn) btn.disabled = true;

            const CHUNK = 40;
            const swaps = new Set();
            let failed = 0;
            for (let i = 0; i < entries.length; i += CHUNK) {
                const chunk = entries.slice(i, i + CHUNK);
                if (statusEl) statusEl.textContent = `Checking ${Math.min(i + CHUNK, entries.length)}/${entries.length}...`;
                const listing = chunk.map((e, idx) => `${idx + 1}. LEFT="${e.latin}" RIGHT="${e.english}"`).join('\n');
                const prompt = `Each numbered line below is a vocabulary entry with two sides. Exactly one side is LATIN and the other is its ENGLISH meaning.

For each line, decide whether it is already in the order LEFT=Latin, RIGHT=English. Return the numbers of ONLY the lines that are BACKWARDS (that is, where LEFT is the English and RIGHT is the Latin).

Judge by the language of the words themselves, not by which looks longer. Latin entries often appear as dictionary forms like "miles, militis" or "mitto, mittere, misi, missum". If a line is ambiguous or you are unsure, do NOT include it.

${listing}

Return ONLY JSON: {"backwards": [numbers]}`;
                try {
                    const result = await callAI(prompt, true);
                    if (result && Array.isArray(result.backwards)) {
                        result.backwards.forEach(n => {
                            const idx = i + (parseInt(n, 10) - 1);
                            if (idx >= i && idx < i + chunk.length) swaps.add(idx);
                        });
                    }
                } catch(e) {
                    console.warn('Direction check failed for chunk', i, e);
                    failed++;
                }
                await new Promise(r => setTimeout(r, 1200));
            }

            if (swaps.size === 0) {
                if (statusEl) statusEl.textContent = failed ? `No changes made (${failed} batch(es) failed — check the console).` : 'Checked — every entry was already the right way round.';
                if (btn) btn.disabled = false;
                return;
            }

            // Rebuild the corpus text from the corrected entries, so what's
            // shown in the box matches what was parsed.
            const rebuilt = entries.map((e, idx) => swaps.has(idx) ? `${e.english} - ${e.latin}` : `${e.latin} - ${e.english}`);
            state.materials.rawText = rebuilt.join('\n');
            // A blanket swap on top of a per-line fix would undo it.
            state.materials.forceSwap = false;
            const area = document.getElementById('rawInputArea');
            if (area) area.value = state.materials.rawText;
            parseVocab();
            saveState();
            render();
            alert(`Flipped ${swaps.size} entr${swaps.size === 1 ? 'y' : 'ies'} that were written English-first.` +
                  (failed ? `\n\n${failed} batch(es) failed and were left alone.` : ''));
        }

        async function enrichVocabWithAI() {
            if (!aiConfigured()) {
                alert('Set up an AI connection in Settings first.');
                return;
            }
            const words = state.materials.vocabList;
            if (words.length === 0) {
                alert('No vocab to index yet — save some in the Input Corpus first.');
                return;
            }
            const btn = document.getElementById('enrichBtn');
            const statusEl = document.getElementById('enrichStatus');
            btn.disabled = true;
            await enrichWordList(words, (done, total) => { statusEl.textContent = `Indexing ${done}/${total} words...`; });
            statusEl.textContent = `Indexed ${words.length} words.`;
            btn.disabled = false;
            render();
        }

        // Runs quietly after materials are saved — indexes only words that
        // aren't already in state.materials.enrichment, so re-saving doesn't
        // re-spend API calls on words already indexed. This only covers words
        // that are actually in the vocab list (Input Corpus) — a word that
        // only appears inside a Style Examples sentence, but isn't also in
        // the vocab list, won't get picked up here (there's no reliable way
        // to split arbitrary sentence text into headwords to index).
        let autoIndexRunning = false;
        async function autoIndexNewWords() {
            if (autoIndexRunning) return;
            if (!aiConfigured()) return;
            const newWords = state.materials.vocabList.filter(w => !state.materials.enrichment[w.latin]);
            if (newWords.length === 0) return;
            autoIndexRunning = true;
            const statusEl = document.getElementById('enrichStatus');
            if (statusEl) statusEl.textContent = `Auto-indexing ${newWords.length} new word(s)...`;
            try {
                await enrichWordList(newWords, (done, total) => {
                    const el = document.getElementById('enrichStatus');
                    if (el) el.textContent = `Auto-indexing new words: ${done}/${total}...`;
                });
            } finally {
                autoIndexRunning = false;
                const el = document.getElementById('enrichStatus');
                if (el) el.textContent = `Indexed ${state.materials.vocabList.length} words.`;
                render();
            }
        }

        async function sortMaterialWithAI(rawText, sourceLabel) {
            const prompt = `You are processing raw text extracted from a Latin study document (source: ${sourceLabel}), which may be a vocab list, a grammar sheet, or a past test/worksheet containing full example sentences with translations.

Split it into three categories:
1. "vocab": an array of strings, each formatted as "latin - english" (use full principal parts where given, e.g. "amo, amare, amavi, amatum - to love"). Only genuine single-word/short vocabulary entries — not sentences, not grammar rules.
2. "grammar": a single string containing grammar content — declension/conjugation tables, case/tense/mood rules, word-order rules, explanations — with vocabulary and example sentences removed.
3. "examples": a single string containing full graded example sentences with their translations, one pair per line as "Latin sentence = English translation" (either direction), taken verbatim from test/worksheet content. This is for sentences a teacher actually wrote or graded — not simple made-up phrases, and not grammar-rule explanations.

If a section clearly isn't Latin study material (e.g. page headers, OCR noise), omit it entirely rather than forcing it into any category.

Return ONLY JSON in this exact shape, no other text: {"vocab": ["...", "..."], "grammar": "...", "examples": "..."}

Raw text:
"""
${rawText.substring(0, 6000)}
"""`;
            const parsed = await callAI(prompt, true);
            return {
                vocab: (parsed && Array.isArray(parsed.vocab)) ? parsed.vocab : [],
                grammar: (parsed && typeof parsed.grammar === 'string') ? parsed.grammar : '',
                examples: (parsed && typeof parsed.examples === 'string') ? parsed.examples : ''
            };
        }

        // ==================== OFFLINE SENTENCE ENGINE ====================
        // Everything below runs with no AI. The old version had exactly one
        // template per type (every latToEng question was literally
        // "<word> in urbe habitat"), which is why generated sentences all
        // looked identical and always mentioned the city. This builds real
        // sentences from actual morphology across a bank of constructions.

        const rand = arr => arr[Math.floor(Math.random() * arr.length)];
        const shuffled = arr => arr.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

        // A vocab entry's Latin field is a full dictionary listing
        // ("rex, regis", "mitto, mittere, misi, missus"). Dropping it into a
        // sentence whole produced things like "rex, regis in urbe habitat" —
        // always take just the headword.
        function headword(entry) {
            return String(entry || '').split(',')[0].trim().split(/\s+/)[0].trim();
        }

        // "to send, dispatch" -> "send". Strips the infinitive marker, extra
        // senses, and any parenthetical.
        function gloss(english) {
            return String(english || '')
                .replace(/\([^)]*\)/g, '')
                .split(/[,;\/]| or /)[0]
                .replace(/^\s*to\s+/i, '')
                .replace(/^\s*(a|an|the)\s+/i, '')
                .trim();
        }

        const EN_PAST = {
            send:'sent', see:'saw', say:'said', tell:'told', give:'gave', take:'took', make:'made',
            find:'found', hear:'heard', hold:'held', keep:'kept', lead:'led', leave:'left', lose:'lost',
            meet:'met', read:'read', run:'ran', seek:'sought', sell:'sold', sit:'sat', stand:'stood',
            teach:'taught', think:'thought', throw:'threw', understand:'understood', win:'won', write:'wrote',
            build:'built', buy:'bought', catch:'caught', choose:'chose', come:'came', do:'did', drink:'drank',
            drive:'drove', eat:'ate', fall:'fell', feel:'felt', fight:'fought', flee:'fled', fly:'flew',
            forget:'forgot', get:'got', go:'went', grow:'grew', know:'knew', lay:'laid', lie:'lay',
            put:'put', rise:'rose', seem:'seemed', set:'set', shake:'shook', shine:'shone', shout:'shouted',
            sing:'sang', sleep:'slept', speak:'spoke', spend:'spent', steal:'stole', strike:'struck',
            swim:'swam', wear:'wore', bear:'bore', beat:'beat', begin:'began', bring:'brought', break:'broke',
            hide:'hid', bind:'bound', draw:'drew', fear:'feared', have:'had', be:'was'
        };
        const EN_PP = { ...EN_PAST, see:'seen', give:'given', take:'taken', write:'written', throw:'thrown',
            know:'known', do:'done', drive:'driven', eat:'eaten', fall:'fallen', forget:'forgotten',
            break:'broken', choose:'chosen', drink:'drunk', speak:'spoken', steal:'stolen', wear:'worn',
            bear:'borne', begin:'begun', hide:'hidden', draw:'drawn', go:'gone', grow:'grown', rise:'risen',
            sing:'sung', swim:'swum', be:'been' };

        function en3sg(base) {
            if (/[sxz]$|[cs]h$/i.test(base)) return base + 'es';
            if (/[^aeiou]y$/i.test(base)) return base.slice(0, -1) + 'ies';
            return base + 's';
        }
        function enPast(base) {
            const w = base.toLowerCase();
            if (EN_PAST[w]) return EN_PAST[w];
            if (/e$/i.test(base)) return base + 'd';
            if (/[^aeiou]y$/i.test(base)) return base.slice(0, -1) + 'ied';
            return base + 'ed';
        }
        function enPP(base) {
            const w = base.toLowerCase();
            if (EN_PP[w]) return EN_PP[w];
            return enPast(base);
        }
        function enGerund(base) {
            if (/[^aeiou]e$/i.test(base) && !/ee$/i.test(base)) return base.slice(0, -1) + 'ing';
            return base + 'ing';
        }

        // Gender is only reliably derivable for 1st/2nd declension shapes.
        // Anything else returns null, and patterns needing agreement (perfect
        // passives) are skipped rather than guessed at — a wrong participle
        // ending is worse than a slightly narrower template bank.
        function guessGender(entry) {
            const parts = entry.split(',').map(x => x.trim());
            const nom = parts[0].toLowerCase();
            const gen = (parts[1] || '').toLowerCase();
            if (gen && !/^-/.test(gen)) {
                if (/ae$/.test(gen) && /a$/.test(nom)) return 'f';
                if (/i$/.test(gen) && /(us|er)$/.test(nom)) return 'm';
                if (/i$/.test(gen) && /um$/.test(nom)) return 'n';
                return null; // 3rd/4th/5th — gender isn't derivable from form
            }
            if (/a$/.test(nom)) return 'f';
            if (/us$|er$/.test(nom)) return 'm';
            if (/um$/.test(nom)) return 'n';
            return null;
        }

        // Nominative/accusative plural, only for the two declensions where the
        // ending is unambiguous.
        function pluralForms(entry) {
            const nom = headword(entry);
            const g = guessGender(entry);
            if (g === 'f' && /a$/i.test(nom)) return { nom: nom.slice(0, -1) + 'ae', acc: nom.slice(0, -1) + 'as' };
            if (g === 'm' && /us$/i.test(nom)) return { nom: nom.slice(0, -2) + 'i', acc: nom.slice(0, -2) + 'os' };
            if (g === 'm' && /er$/i.test(nom)) { const st = entry.split(',')[1] ? entry.split(',')[1].trim().slice(0, -1) : nom; return { nom: st + 'i', acc: st + 'os' }; }
            if (g === 'n' && /um$/i.test(nom)) return { nom: nom.slice(0, -2) + 'a', acc: nom.slice(0, -2) + 'a' };
            return null;
        }

        // Everything the sentence patterns need from one verb entry. Returns
        // null for anything it can't inflect confidently (deponents, unusual
        // shapes) so those verbs simply don't get used in generated sentences.
        function verbEngine(entry) {
            const shorthand = parseAnkiVerbShorthand(entry);
            const parts = entry.split(',').map(x => x.trim());
            let inf, conj, first;
            if (shorthand) { inf = shorthand.infinitive.toLowerCase(); conj = shorthand.conj; first = shorthand.present; }
            else {
                first = parts[0];
                inf = (parts[1] || '').toLowerCase();
                if (!inf) return null;
                if (inf.endsWith('are')) conj = '1';
                else if (inf.endsWith('ire')) conj = '4';
                else if (inf.endsWith('ere')) conj = /eo$/i.test(first) ? '2' : '3';
                else return null; // -ari/-eri deponents and irregulars: skipped
            }
            if (!/(are|ere|ire)$/.test(inf)) return null;
            const stem = inf.slice(0, -3);
            const io = conj === '3' && /io$/i.test(first);

            // Perfect and supine stems only exist when full principal parts
            // were supplied — Anki shorthand has neither.
            const perfStem = (!shorthand && parts[2]) ? parts[2].replace(/i$/, '') : null;
            const supStem = (!shorthand && parts[3]) ? parts[3].replace(/(um|us)$/, '') : null;

            const thematic = conj === '1' ? 'a' : conj === '2' ? 'e' : conj === '4' ? 'ie' : (io ? 'ie' : 'e');

            return {
                inf,
                pres3sg: conj === '1' ? stem + 'at' : conj === '2' ? stem + 'et' : conj === '4' ? stem + 'it' : (io ? stem + 'it' : stem + 'it'),
                pres3pl: conj === '1' ? stem + 'ant' : conj === '2' ? stem + 'ent' : conj === '4' ? stem + 'iunt' : (io ? stem + 'iunt' : stem + 'unt'),
                impf3sg: stem + thematic + 'bat',
                impf3pl: stem + thematic + 'bant',
                fut3sg: (conj === '1' || conj === '2') ? stem + thematic + 'bit' : stem + (io || conj === '4' ? 'iet' : 'et'),
                presSubj3sg: conj === '1' ? stem + 'et' : conj === '2' ? stem + 'eat' : conj === '4' ? stem + 'iat' : (io ? stem + 'iat' : stem + 'at'),
                presSubj3pl: conj === '1' ? stem + 'ent' : conj === '2' ? stem + 'eant' : conj === '4' ? stem + 'iant' : (io ? stem + 'iant' : stem + 'ant'),
                impfSubj3sg: inf + 't',      // imperfect subjunctive = present infinitive + ending
                impfSubj3pl: inf + 'nt',
                perf3sg: perfStem ? perfStem + 'it' : null,
                perf3pl: perfStem ? perfStem + 'erunt' : null,
                plupf3sg: perfStem ? perfStem + 'erat' : null,
                plupfSubj3sg: perfStem ? perfStem + 'isset' : null,
                ppp: supStem ? { m: supStem + 'us', f: supStem + 'a', n: supStem + 'um' } : null
            };
        }

        // Random pairing produces grammatical nonsense like "the war saw the
        // king" or "the book works so hard that...". AI indexing (collocates +
        // semantic category) fixes this properly, but it isn't always run, so
        // there's a built-in animacy check as a floor: things that can't act
        // don't get used as subjects of verbs.
        const ANIMATE_GLOSSES = new Set(['king','queen','soldier','messenger','girl','boy','man','woman','child',
            'children','slave','master','servant','leader','general','commander','citizen','farmer','sailor',
            'priest','priestess','teacher','master','student','pupil','friend','enemy','father','mother',
            'brother','sister','son','daughter','parent','horse','dog','wolf','lion','bird','animal','horseman',
            'guard','prisoner','captive','poet','senator','consul','merchant','trader','doctor','judge','thief',
            'hero','god','goddess','guest','host','stranger','messenger','centurion','emperor','sentry','crowd',
            'army','people','youth','old man','woman','athlete','singer','actor','hunter','shepherd','witness',
            'nurse','cook','baker','robber','pirate','giant','ghost','client','patron','ally','tribune','legate']);

        function isAnimate(v) {
            if (v.semanticCategory === 'person' || v.semanticCategory === 'animal') return true;
            if (v.semanticCategory) return false; // indexed as object/place/abstract/etc.
            return ANIMATE_GLOSSES.has(gloss(v.english).toLowerCase());
        }

        function capitalise(str) {
            return str ? str.charAt(0).toUpperCase() + str.slice(1) : str;
        }

        const PLACES = [
            { abl: 'in urbe', acc: 'ad urbem', eng: 'in the city', engTo: 'to the city' },
            { abl: 'in silva', acc: 'in silvam', eng: 'in the forest', engTo: 'into the forest' },
            { abl: 'in foro', acc: 'ad forum', eng: 'in the forum', engTo: 'to the forum' },
            { abl: 'in litore', acc: 'ad litus', eng: 'on the shore', engTo: 'to the shore' },
            { abl: 'in castris', acc: 'ad castra', eng: 'in the camp', engTo: 'to the camp' },
            { abl: 'in templo', acc: 'in templum', eng: 'in the temple', engTo: 'into the temple' },
            { abl: 'in villa', acc: 'ad villam', eng: 'in the villa', engTo: 'to the villa' },
            { abl: 'prope flumen', acc: 'trans flumen', eng: 'near the river', engTo: 'across the river' },
            { abl: 'in monte', acc: 'in montem', eng: 'on the mountain', engTo: 'onto the mountain' },
            { abl: 'in via', acc: 'per vias', eng: 'on the road', engTo: 'through the streets' }
        ];
        // `manner` marks the ones that can follow "tam" ("so bravely") —
        // "tam heri" ("so yesterday") is not a sentence.
        const ADVERBS = [
            { lat: 'saepe', eng: 'often', manner: true }, { lat: 'tandem', eng: 'at last' },
            { lat: 'statim', eng: 'immediately' }, { lat: 'celeriter', eng: 'quickly', manner: true },
            { lat: 'fortiter', eng: 'bravely', manner: true }, { lat: 'diu', eng: 'for a long time' },
            { lat: 'iterum', eng: 'again' }, { lat: 'numquam', eng: 'never' },
            { lat: 'semper', eng: 'always' }, { lat: 'heri', eng: 'yesterday' },
            { lat: 'hodie', eng: 'today' }, { lat: 'subito', eng: 'suddenly' },
            { lat: 'libenter', eng: 'gladly', manner: true }, { lat: 'magnopere', eng: 'greatly', manner: true },
            { lat: 'lente', eng: 'slowly', manner: true }, { lat: 'crudeliter', eng: 'cruelly', manner: true },
            { lat: 'facile', eng: 'easily', manner: true }, { lat: 'cras', eng: 'tomorrow' }
        ];

        // Each pattern returns {lat, eng} or null when it needs something this
        // particular verb/noun can't supply (no perfect stem, unknown gender).
        // Callers just retry with another pattern.
        const SENTENCE_PATTERNS = [
            c => ({ lat: `${c.Sn} ${c.Oa} ${c.v.pres3sg}.`, eng: `The ${c.sEn} ${en3sg(c.vEn)} the ${c.oEn}.` }),
            c => ({ lat: `${c.adv.lat} ${c.Sn} ${c.Oa} ${c.v.impf3sg}.`, eng: `The ${c.sEn} was ${c.adv.eng} ${enGerund(c.vEn)} the ${c.oEn}.` }),
            c => c.v.perf3sg && ({ lat: `${c.Sn} ${c.Oa} ${c.v.perf3sg}.`, eng: `The ${c.sEn} ${enPast(c.vEn)} the ${c.oEn}.` }),
            c => ({ lat: `${c.Sn} ${c.Oa} ${c.v.fut3sg}.`, eng: `The ${c.sEn} will ${c.vEn} the ${c.oEn}.` }),
            c => ({ lat: `${c.Sn} ${c.place.abl} ${c.Oa} ${c.v.pres3sg}.`, eng: `The ${c.sEn} ${en3sg(c.vEn)} the ${c.oEn} ${c.place.eng}.` }),
            c => ({ lat: `${c.Sn} festinat ut ${c.Oa} ${c.v.presSubj3sg}.`, eng: `The ${c.sEn} is hurrying in order to ${c.vEn} the ${c.oEn}.` }),
            c => ({ lat: `${c.Sn} ${c.place.acc} fugit ne ${c.Oa} ${c.v.presSubj3sg}.`, eng: `The ${c.sEn} is fleeing ${c.place.engTo} so as not to ${c.vEn} the ${c.oEn}.` }),
            c => c.v.plupfSubj3sg && ({ lat: `Cum ${c.Sn} ${c.Oa} ${c.v.plupfSubj3sg}, cives ${c.adv.lat} timebant.`, eng: `When the ${c.sEn} had ${enPP(c.vEn)} the ${c.oEn}, the citizens were ${c.adv.eng} afraid.` }),
            c => ({ lat: `Cum ${c.Sn} ${c.Oa} ${c.v.impfSubj3sg}, ${c.place.abl} manebamus.`, eng: `While the ${c.sEn} was ${enGerund(c.vEn)} the ${c.oEn}, we were waiting ${c.place.eng}.` }),
            c => c.v.perf3sg && ({ lat: `${c.Sn}, qui ${c.Oa} ${c.v.perf3sg}, nunc ${c.place.abl} est.`, eng: `The ${c.sEn}, who ${enPast(c.vEn)} the ${c.oEn}, is now ${c.place.eng}.` }),
            c => c.sAnimate && ({ lat: `magister ${c.Sd} persuasit ut ${c.Oa} ${c.v.presSubj3sg}.`, eng: `The teacher persuaded the ${c.sEn} to ${c.vEn} the ${c.oEn}.` }),
            c => c.sAnimate && ({ lat: `dux ${c.Sa} monuit ne ${c.Oa} ${c.v.presSubj3sg}.`, eng: `The leader warned the ${c.sEn} not to ${c.vEn} the ${c.oEn}.` }),
            c => c.Spl && ({ lat: `${c.Spl.nom} ${c.adv.lat} ${c.Oa} ${c.v.pres3pl}.`, eng: `The ${c.sEnPl} ${c.adv.eng} ${c.vEn} the ${c.oEn}.` }),
            c => c.v.perf3sg && ({ lat: `${c.adv.lat} ${c.Sn} ${c.place.abl} ${c.Oa} ${c.v.perf3sg}.`, eng: `${c.adv.eng.charAt(0).toUpperCase() + c.adv.eng.slice(1)} the ${c.sEn} ${enPast(c.vEn)} the ${c.oEn} ${c.place.eng}.` }),
            c => c.sAnimate && ({ lat: `nuntius dicit ${c.Sa} ${c.Oa} ${c.v.inf}.`, eng: `The messenger says that the ${c.sEn} is ${enGerund(c.vEn)} the ${c.oEn}.` }),
            c => c.v.plupf3sg && ({ lat: `ubi ${c.Sn} ${c.Oa} ${c.v.plupf3sg}, omnes gaudebant.`, eng: `When the ${c.sEn} had ${enPP(c.vEn)} the ${c.oEn}, everyone was rejoicing.` }),
            c => (c.v.ppp && c.oGender) && ({ lat: `${c.On} a ${c.Sabl} ${c.v.ppp[c.oGender]} est.`, eng: `The ${c.oEn} was ${enPP(c.vEn)} by the ${c.sEn}.` }),
            c => (c.sAnimate && c.adv.manner) && ({ lat: `tam ${c.adv.lat} ${c.Sn} laborat ut ${c.Oa} ${c.v.presSubj3sg}.`, eng: `The ${c.sEn} works so ${c.adv.eng} that he ${en3sg(c.vEn)} the ${c.oEn}.` }),
            c => c.sAnimate && ({ lat: `cur ${c.Sn} ${c.Oa} ${c.v.pres3sg}?`, eng: `Why does the ${c.sEn} ${c.vEn} the ${c.oEn}?` }),
            c => (c.sAnimate && c.Spl) && ({ lat: `${c.Spl.nom} ${c.place.acc} festinaverunt ut ${c.Oa} ${c.v.presSubj3pl}.`, eng: `The ${c.sEnPl} hurried ${c.place.engTo} in order to ${c.vEn} the ${c.oEn}.` })
        ];

        const PHRASE_PATTERNS = [
            c => ({ lat: `${c.Oa} ${c.v.pres3sg}`, eng: `he ${en3sg(c.vEn)} the ${c.oEn}` }),
            c => ({ lat: `${c.Sn} ${c.v.impf3sg}`, eng: `the ${c.sEn} was ${enGerund(c.vEn)}` }),
            c => ({ lat: `${c.On} ${c.Sg}`, eng: `the ${c.oEn} of the ${c.sEn}` }),
            c => ({ lat: `cum ${c.Sabl}`, eng: `with the ${c.sEn}` }),
            c => ({ lat: `sine ${c.Sabl}`, eng: `without the ${c.sEn}` }),
            c => ({ lat: `${c.Sd} ${c.Oa} ${c.v.pres3sg}`, eng: `he ${en3sg(c.vEn)} the ${c.oEn} to the ${c.sEn}` }),
            c => ({ lat: `${c.Oa} ${c.v.inf}`, eng: `to ${c.vEn} the ${c.oEn}` }),
            c => c.Spl && ({ lat: `${c.Spl.nom} ${c.v.pres3pl}`, eng: `the ${c.sEnPl} ${c.vEn}` }),
            c => ({ lat: `${c.place.acc}`, eng: `${c.place.engTo}` }),
            c => ({ lat: `${c.Sn} ${c.place.abl}`, eng: `the ${c.sEn} ${c.place.eng}` }),
            c => c.v.perf3sg && ({ lat: `${c.Sn} ${c.v.perf3sg}`, eng: `the ${c.sEn} ${enPast(c.vEn)}` }),
            c => ({ lat: `${c.adv.lat} ${c.v.pres3pl}`, eng: `they ${c.adv.eng} ${c.vEn}` })
        ];

        function pluralEn(word) {
            if (/(s|x|z|ch|sh)$/i.test(word)) return word + 'es';
            if (/[^aeiou]y$/i.test(word)) return word.slice(0, -1) + 'ies';
            if (/man$/i.test(word)) return word.slice(0, -3) + 'men';
            return word + 's';
        }

        // The style examples are real, teacher-written, already-correct
        // sentences. Serving some of them verbatim guarantees a slice of every
        // session is exactly the target quality, instead of everything being
        // an imitation of it.
        function parseStylePairs() {
            return String(state.materials.styleExamples || '').split('\n')
                .map(l => l.trim())
                .filter(l => l && !l.startsWith('#') && !l.startsWith('---') && l.includes('='))
                .map(l => {
                    const i = l.indexOf('=');
                    let lat = l.slice(0, i).trim(), eng = l.slice(i + 1).trim();
                    // Tolerate a file written the other way round.
                    if (looksEnglish(lat) && !looksEnglish(eng)) { const t = lat; lat = eng; eng = t; }
                    return { lat, eng };
                })
                .filter(p => p.lat && p.eng && p.lat.split(/\s+/).length >= 3);
        }

        // Serve unseen examples first; once they've all been used, start the
        // rotation again rather than running dry.
        function takeUnusedPairs(pairs, n) {
            if (n <= 0 || pairs.length === 0) return [];
            const used = new Set(state.practice.usedExamples || []);
            let pool = pairs.filter(p => !used.has(p.lat));
            if (pool.length < n) { state.practice.usedExamples = []; pool = pairs; }
            const picked = shuffled(pool).slice(0, n);
            state.practice.usedExamples = [...(state.practice.usedExamples || []), ...picked.map(p => p.lat)].slice(-500);
            return picked;
        }

        // A second pass over the generated Latin. Worth the extra call: a
        // wrong model answer is worse than a dull one, because it marks a
        // correct answer wrong and teaches the wrong form. Reviewing text is
        // also an easier task than composing it, so this catches errors the
        // same model made a minute earlier.
        async function verifyQuestions(questions, type) {
            if (!state.settings.verifyOutput) return questions;
            const SENTENCE_TYPES_V = ['latSentence', 'engSentence', 'unseen'];
            if (!SENTENCE_TYPES_V.includes(type)) return questions;

            const latinOf = q => type === 'engSentence' ? q.target : q.prompt;
            const listing = questions.map((q, i) => `${i + 1}. LATIN: ${latinOf(q)}\n   ENGLISH: ${type === 'engSentence' ? q.prompt : q.target}`).join('\n');

            const prompt = `You are a Latin teacher proofreading exam answers before they go to a Year 10 student. Each numbered item is a Latin sentence with its English translation. Find and fix errors in the LATIN.

Check especially:
- Sequence of tenses. "had been done" needs the PLUPERFECT subjunctive (oppugnata esset), NOT the perfect subjunctive (oppugnata sit). "was doing" needs the imperfect subjunctive. A past main verb requires the imperfect subjunctive in a following ut/ne clause.
- Agreement: every adjective and perfect passive participle must match its noun in gender, number and case (urbs oppugnata, milites victi).
- Case: a/ab takes the ablative; persuadeo/impero/credo take the dative; rogo/moneo/oro take the accusative; every preposition governs its proper case.
- That the Latin and the English actually say the same thing.
- That the sentence describes a coherent situation (a priest does not have "his soldiers").

${listing}

Return ONLY JSON. Include an entry for every item that needs changing; omit items that are already correct:
{"fixes": [{"n": 1, "latin": "the corrected full Latin sentence", "why": "six words or fewer"}]}`;

            try {
                const result = await callAI(prompt, true);
                if (!result || !Array.isArray(result.fixes)) return questions;
                let applied = 0;
                result.fixes.forEach(f => {
                    const idx = parseInt(f.n, 10) - 1;
                    if (idx < 0 || idx >= questions.length || !f.latin || typeof f.latin !== 'string') return;
                    const fixed = f.latin.trim();
                    // A "fix" that swapped the sentence for English, or emptied
                    // it, is a worse outcome than the original — ignore those.
                    if (!fixed || looksEnglish(fixed)) return;
                    if (type === 'engSentence') questions[idx].target = fixed;
                    else questions[idx].prompt = fixed;
                    questions[idx].verified = true;
                    if (f.why) questions[idx].extra = (questions[idx].extra ? questions[idx].extra + ' ' : '') + '[corrected: ' + f.why + ']';
                    applied++;
                });
                if (applied) console.info(`Verification pass corrected ${applied} of ${questions.length} sentences.`);
            } catch(e) {
                console.warn('Verification pass failed, using unverified questions:', e);
            }
            return questions;
        }

        // ==================== TEACHER MODEL ====================
        // Everything here is computed from the real sentences, with no AI and
        // no training. The point is that "write like my teacher" is mostly a
        // statistical fact about which words this teacher reaches for, which
        // words they put next to each other, and which constructions they
        // favour — all of which can be measured directly and handed to the
        // model as fact instead of hoped for.
        //
        // IMPORTANT: only real teacher sentences feed this. Generated
        // sentences are deliberately excluded — training the profile on the
        // model's own output would make it drift toward imitating itself
        // rather than the teacher, and that drift compounds silently.

        const LATIN_STOP = new Set(['et','sed','in','ad','cum','non','qui','quae','quod','quem','quam','quos','quas',
            'est','sunt','erat','erant','esset','essent','sit','sint','fuit','ut','ne','ex','e','ab','a','per','pro',
            'sub','atque','nec','iam','tamen','enim','autem','se','sibi','suus','sua','suum','suos','suis','suam',
            'hic','haec','hoc','hunc','hanc','huius','ille','illa','illud','illum','illam','illius','is','ea','id',
            'eum','eam','eos','eas','ei','eis','ipse','ipsa','ipsum','idem','eadem','eodem','omnis','omnes','omnia',
            'de','si','quia','dum','nam','tam','ita','sic','me','te','nos','vos','mihi','tibi','nobis','vobis']);

        function latinTokens(sentence) {
            return String(sentence || '').toLowerCase()
                .replace(/[^a-z\s]/g, ' ')
                .split(/\s+/).filter(Boolean);
        }

        // Crude stemmer: groups inflected forms of the same word together so
        // "militem/militibus/milites" count as one thing. Not linguistically
        // proper, but consistent, which is all the statistics need.
        function crudeStem(w) {
            if (w.length <= 4) return w;
            const stripped = w.replace(/(ibus|orum|arum|erunt|erent|arent|irent|antur|entur|abant|ebant|issent|isset|erat|erant|avit|ivit|uit|ere|are|ire|em|es|is|us|um|am|as|os|ae|i|o|e|a|s|t)$/,'');
            return stripped.length >= 4 ? stripped : w.slice(0, 4);
        }

        const CONSTRUCTION_TESTS = [
            ['cum + pluperfect subjunctive', /\bcum\b[^.]*\b(\w+isset|\w+issent|esset|essent)\b/i],
            ['cum + imperfect subjunctive', /\bcum\b[^.]*\b\w+(aret|eret|iret|arent|erent|irent|retur|rentur)\b/i],
            ['cum + present subjunctive', /\bcum\b[^.]*\b(sit|sint|habeam|possit)\b/i],
            ['purpose clause (ut)', /\but\b/i],
            ['negative purpose / fear (ne)', /\bne\b/i],
            ['indirect command', /\b(persuas|imperav|rogav|monuit|oravit|hortatus|imperat|rogat|monet)\w*/i],
            ['passive with agent (a/ab)', /\b(a|ab)\s+\w+(o|is|e|ibus)\b/i],
            ['perfect passive', /\b\w+(us|a|um|i|ae)\s+(est|sunt|erat|erant|esset|essent|sit|sint)\b/i],
            ['relative clause', /\b(qui|quae|quod|quem|quam|quos|quas|cuius|quibus)\b/i],
            ['superlative', /(issim|errim|illim)\w*/i],
            ['comparative', /\w+(ior|ius)\b/i],
            ['quam + superlative', /\bquam\s+\w*(issim|errim|illim)/i],
            ['ablative of time / duration', /\b(die|diebus|annos|annis|horas|noctem|nocte|mense|luce)\b/i],
            ['numeral', /\b(unus|unum|duo|duos|duas|tres|tria|quattuor|quinque|sex|septem|octo|novem|decem|primus|primam|secundus|tertius|quintus|decima|decimam|plures|plurimi|plurimae|plurimos)\b/i],
            ['question word', /\b(cur|quis|quid|ubi|quo|quot|num|nonne|quando)\b/i],
            ['imperative', /\b(ora|roga|da|fac|duc|dic|ite|venite|portate|laudate|invenite|transite)\b/i]
        ];

        let _teacherModel = null;
        let _teacherModelKey = '';

        function buildTeacherModel() {
            const pairs = parseStylePairs();
            const key = pairs.length + ':' + (state.materials.styleExamples || '').length;
            if (_teacherModel && _teacherModelKey === key) return _teacherModel;

            const openings = {}, wordFreq = {}, bigrams = {}, colloc = {}, constructions = {};
            const lengths = [];
            let subordinateFirst = 0;

            pairs.forEach(p => {
                const toks = latinTokens(p.lat);
                if (toks.length < 2) return;
                lengths.push(toks.length);
                openings[toks[0]] = (openings[toks[0]] || 0) + 1;
                if (/^(cum|ut|ne|postquam|ubi|si|quamquam|dum|antequam)$/.test(toks[0])) subordinateFirst++;

                CONSTRUCTION_TESTS.forEach(([name, re]) => {
                    if (re.test(p.lat)) constructions[name] = (constructions[name] || 0) + 1;
                });

                // Word-to-word: which word actually follows which.
                for (let i = 0; i < toks.length - 1; i++) {
                    const k = toks[i];
                    bigrams[k] = bigrams[k] || {};
                    bigrams[k][toks[i + 1]] = (bigrams[k][toks[i + 1]] || 0) + 1;
                }

                // Which content words this teacher puts in the same sentence.
                const content = [...new Set(toks.filter(t => t.length > 3 && !LATIN_STOP.has(t)).map(crudeStem))];
                content.forEach(t => {
                    wordFreq[t] = (wordFreq[t] || 0) + 1;
                    colloc[t] = colloc[t] || {};
                    content.forEach(o => { if (o !== t) colloc[t][o] = (colloc[t][o] || 0) + 1; });
                });
            });

            const sortedBy = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]);
            _teacherModel = {
