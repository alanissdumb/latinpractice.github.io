<body class="bg-parchment-50 text-stone-800 font-sans min-h-full flex flex-col selection:bg-sage-200 selection:text-sage-900">

    <header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-1">
                    <button onclick="navigateTo('home')" class="px-3 py-2 rounded-lg text-stone-700 hover:text-sage-700 hover:bg-stone-100 transition font-medium text-sm flex items-center gap-2">

                    </button>
                    <button onclick="navigateTo('practice_select')" class="px-3 py-2 rounded-lg text-stone-600 hover:text-sage-700 hover:bg-stone-100 transition text-sm font-medium flex items-center gap-2">

                    <button onclick="navigateTo('wordbank')" class="px-3 py-2 rounded-lg text-stone-600 hover:text-sage-700 hover:bg-stone-100 transition text-sm font-medium flex items-center gap-2">

                    <button onclick="navigateTo('materials')" class="px-3 py-2 rounded-lg text-stone-600 hover:text-sage-700 hover:bg-stone-100 transition text-sm font-medium flex items-center gap-2">

                    </button>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="profileSwitcher"></div>
                    <button onclick="navigateTo('settings')" class="p-2 rounded-lg text-stone-500 hover:text-sage-700 hover:bg-stone-100 transition" title="Settings">
                        <i class="fa-solid fa-sliders text-base"></i>

        </div>
    </header>

    <main id="appContainer" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DEFAULT_STATE = {
            view: 'home',
            stats: { completedToday: 0, streak: 0, totalAnswered: 0, totalCorrect: 0, lastStudyDate: null },
            settings: {
                apiKey: '',
                apiUrl: 'https://api.openai.com/v1',
                model: 'gpt-3.5-turbo',
                vocabDirection: 'latToEng',
                batchSize: 5,
                verifyOutput: true,
                // Saved connections. apiKey/apiUrl/model above stay as the
                // ACTIVE connection so every existing call site keeps working;
                // switching a profile just copies its values into them.
                profiles: [],
                activeProfileId: null,
                autoFallback: true,
                autoAdvance: false,
                soundEffects: false
            },
            materials: {
                rawText: "puella - girl\nbonus - good\ncurro, currere, cucurri, cursum - to run\nhortor, hortari, hortatus sum - to encourage\nrex, regis - king\nurbs, urbis - city\nmagnus - great\ntimeo, timere, timui - to fear\namo, amare, amavi, amatum - to love\nmiles, militis - soldier\nbellum - war\npax, pacis - peace\nporto, portare, portavi, portatus - to carry\nmitto, mittere, misi, missus - to send",
                vocabList: [],
                images: [],
                grammarNotes: '',
                styleExamples: '',
                forceSwap: false,
                enrichment: {},
                lastExtractedExamples: ''
            },
            wordBank: [],
            quiz: { active: false, type: '', questions: [], index: 0, isInfinite: false, results: [], answered: false },
            practice: { focusTopic: '', usedExamples: [] }
        };

        let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
        // Surfaced on the question card when a generation call fails, so a
        // silent drop to offline templates is visible instead of mysterious.
        let lastAiError = '';

        function loadState() {
            try {
                const saved = localStorage.getItem('latin_practice_app_v4');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...DEFAULT_STATE, ...parsed };
                    if (parsed.settings) state.settings = { ...DEFAULT_STATE.settings, ...parsed.settings };
                    if (parsed.materials) state.materials = { ...DEFAULT_STATE.materials, ...parsed.materials };
                    if (parsed.stats) state.stats = { ...DEFAULT_STATE.stats, ...parsed.stats };
                    if (parsed.practice) state.practice = { ...DEFAULT_STATE.practice, ...parsed.practice };
                    // Anyone upgrading has a single connection configured but
                    // no profiles — turn it into the first profile so they
                    // don't have to re-enter it.
                    if (!Array.isArray(state.settings.profiles)) state.settings.profiles = [];
                    if (state.settings.profiles.length === 0 && state.settings.apiUrl) {
                        const p = { id: 'p' + Date.now(), name: guessProfileName(state.settings.apiUrl, state.settings.model),
                                    apiKey: state.settings.apiKey, apiUrl: state.settings.apiUrl, model: state.settings.model };
                        state.settings.profiles = [p];
                        state.settings.activeProfileId = p.id;
                    }
                    // Old saves carried a daily-mix section that no longer exists.
                    delete state.settings.dailyMix;
                    delete state.dailyLauncher;
                    delete state.dailyCache;
                }
            } catch(e) {}
            parseVocab();
        }

        // Runs once at startup: pulls images out of IndexedDB (where they now
        // live) and, if this is the first load after upgrading, migrates any
        // images left over in the old localStorage-based state into IndexedDB.
        async function hydrateImages() {
            const legacyImages = state.materials.images || [];
            const dbImages = await loadImagesFromDB();
            if (dbImages.length > 0) {
                state.materials.images = dbImages;
            } else if (legacyImages.length > 0) {
                state.materials.images = legacyImages;
                await saveImagesToDB(legacyImages);
            } else {
                state.materials.images = [];
            }
        }

        // Images are base64 strings, which are large. localStorage has a ~5-10MB
        // total quota shared across the whole app, so storing images there (as
        // before) risks silently failing to save once you've uploaded a handful
        // of photos. IndexedDB has a much larger quota (typically hundreds of MB+),
        // so images now live there instead, separate from the rest of the state.
        const IMG_DB_NAME = 'latin_practice_images';
        const IMG_STORE = 'images';

        function openImageDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(IMG_DB_NAME, 1);
                req.onupgradeneeded = () => { req.result.createObjectStore(IMG_STORE); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveImagesToDB(images) {
            try {
                const db = await openImageDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(IMG_STORE, 'readwrite');
                    tx.objectStore(IMG_STORE).put(images, 'all');
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            } catch(e) { console.warn('Could not save images to IndexedDB', e); }
        }

        async function loadImagesFromDB() {
            try {
                const db = await openImageDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(IMG_STORE, 'readonly');
                    const req = tx.objectStore(IMG_STORE).get('all');
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch(e) { return []; }
        }

        function saveState() {
            // Strip images out of the localStorage payload — they're persisted
            // separately via saveImagesToDB() so they don't count against the
            // localStorage quota.
            const toSave = JSON.parse(JSON.stringify(state));
            toSave.materials.images = [];
            localStorage.setItem('latin_practice_app_v4', JSON.stringify(toSave));
            saveImagesToDB(state.materials.images);
        }

        // Rough part-of-speech guess so templates/prompts don't shove a verb's
        // principal parts into a noun slot (or vice versa). Not linguistically
        // perfect, but "to " in the gloss and comma-count in the Latin form are
        // reliable enough signals for how vocab lists are normally written.
        // Anki decks commonly store verbs as "present infinitive conjugationNumber"
        // with no principal parts at all, e.g. "mitto mittere 3" or "capio capere 3i"
        // (io = 3rd-io). Recognizing this explicitly is far more reliable than
        // guessing conjugation from spelling, since the number IS the conjugation.
        // Real Anki decks write dictionary forms with SPACES and gender
        // markers ("leo leonis m", "mitto mittere misi missus", "civis civis
        // -ium m", "porto 1"), not the neat comma form the rest of this app
        // assumed. Left unhandled, an entire verb deck parses as nouns still
        // in English-first order, and the AI gets almost no verbs to work
        // with — which is why it kept inventing them. This normalises every
        // shape seen in the wild into the canonical comma form before
        // anything else touches it.

        const GENDER_TOK = /^[mfnc]$/i;
        const ISTEM_TOK = /^-?ium$/i;
        const GOVCASE_TOK = /^\+(dat|acc|abl|gen)\.?$/i;
        const CONJ_TOK = /^([1-4])(io)?$/i;
        const INFINITIVE_END = /(are|ere|ire|ari|eri|iri)$/i;

        // Splits on commas OR whitespace, then pulls out the grammar markers.
        function stripLatinMarkers(str) {
            const raw = String(str || '').replace(/[\[\(][^\])]*[\])]/g, ' ').split(/[,;]|\s+/).map(t => t.trim()).filter(Boolean);
            const out = { parts: [], gender: null, istem: false, govCase: null, conj: null, isIo: false };
            raw.forEach(t => {
                if (GOVCASE_TOK.test(t)) { out.govCase = t.replace(/[+.]/g, '').toLowerCase(); return; }
                if (ISTEM_TOK.test(t)) { out.istem = true; return; }
                const c = t.match(CONJ_TOK);
                // Only a real conjugation marker if it follows a Latin 1st
                // person singular ("porto 1"); otherwise it's the deck's own
                // disambiguating number ("order 2") and must not count.
                if (c && out.parts.length > 0 && /o$/i.test(out.parts[0])) { out.conj = c[1]; out.isIo = !!c[2]; return; }
                if (c && out.parts.length > 0) return; // trailing tag, drop it
                // A lone m/f/n is a gender marker, but only after the first
                // token — otherwise a real word could be eaten.
                if (GENDER_TOK.test(t) && out.parts.length > 0) { out.gender = t.toLowerCase(); return; }
                out.parts.push(t);
            });
            return out;
        }

        // Does this side look like the Latin one? Endings are far more
        // reliable here than function words, since dictionary entries have
        // almost no function words in them.
        function latinScore(str) {
            const info = stripLatinMarkers(str);
            let score = 0;
            if (info.gender || info.istem || info.govCase || info.conj) score += 3;
            info.parts.forEach(t => {
                if (INFINITIVE_END.test(t)) score += 2;
                if (/(ae|orum|arum|ibus|issimus|errimus|ior|ius|tus|sus|ctus|ptus|ntis|onis|inis|itis|oris|eris|uris)$/i.test(t)) score += 1;
                if (/^(sum|esse|fui|eo|ire|fero|ferre|tuli|latus)$/i.test(t)) score += 2;
            });
            if (looksEnglish(str)) score -= 3;
            return score;
        }

        // Build "porto, portare" from the shorthand "porto 1".
        function infinitiveFromConj(first, conj, isIo) {
            const stem = first.replace(/o$/i, '');
            if (conj === '1') return stem + 'are';
            if (conj === '2') return stem + 're';
            if (conj === '4') return stem.replace(/i$/i, '') + 'ire';
            return stem.replace(/i$/i, '') + 'ere';
        }

        // Returns { latin, english, pos } in canonical form.
        function normalizeVocabEntry(sideA, sideB) {
            let lat = String(sideA || '').trim(), eng = String(sideB || '').trim();
            if (latinScore(eng) > latinScore(lat)) { const t = lat; lat = eng; eng = t; }

            const info = stripLatinMarkers(lat);
            const parts = info.parts;
            const engClean = eng.replace(/\s*\(\d+\)\s*$/, '').replace(/\s*\d+\s*$/, '').trim();
            if (parts.length === 0) return null;

            // "sollicitus-a-um" arrives as one token — the endings are
            // markers, not part of the word.
            if (parts.length && parts[0].includes('-')) parts[0] = parts[0].split('-')[0];
            const first = parts[0];
            let pos = null;

            // --- verb ---
            const hasInfinitive = parts.length > 1 && parts.slice(1).some(p => INFINITIVE_END.test(p));
            const irregular = /^(sum|possum|eo|fero|volo|nolo|malo|fio|inquam)$/i.test(first) && parts.length > 1;
            if (info.conj || hasInfinitive || irregular || /^(to|i)\s/i.test(eng)) {
                pos = 'verb';
                let vparts = parts.slice();
                if (info.conj && vparts.length === 1) vparts = [first, infinitiveFromConj(first, info.conj, info.isIo)];
                return { latin: vparts.join(', '), english: engClean, pos, govCase: info.govCase };
            }

            // --- adjective ---
            // "sollicitus-a-um", "bonus, -a, -um", "nullus nulla nullum",
            // and comparisons like "malus, peior, pessimus".
            const hyphenAdj = /-(a|ae)-(um|a)$/i.test(lat.replace(/\s/g, '')) || parts.slice(1).some(p => /^-/.test(p));
            const triadAdj = parts.length === 3 && /us$/i.test(first) &&
                /^(a|ae)$/i.test(parts[1].replace(/^-/, '')) === false &&
                (/(ior|ius)$/i.test(parts[1]) || /^(a|um)$/i.test(parts[1])) ;
            const comparison = parts.length === 3 && /(ior|ius)$/i.test(parts[1]) && /(issimus|errimus|illimus|imus)$/i.test(parts[2]);
            const threeGender = parts.length === 3 && /us$/i.test(first) && /a$/i.test(parts[1]) && /um$/i.test(parts[2]);
            if (hyphenAdj || comparison || threeGender) {
                // Only 1st/2nd declension adjectives take -a, -um. A 3rd
                // declension one (fortis, ferox, dives) must not be given
                // endings it doesn't have.
                return { latin: /us$/i.test(first) || /er$/i.test(first) ? first + ', -a, -um' : first,
                         english: engClean, pos: 'adjective' };
            }
            // Single-form 3rd declension adjective given with its genitive
            // ("ferox ferocis") or alone ("fortis"), identified by its gloss.
            if (ADJECTIVE_GLOSSES.has(gloss(engClean).toLowerCase())) {
                return { latin: parts.slice(0, 2).join(', '), english: engClean, pos: 'adjective' };
            }

            // --- noun ---
            return { latin: parts.slice(0, 2).join(', '), english: engClean, pos: 'noun',
                     gender: info.gender, istem: info.istem };
        }

        function parseAnkiVerbShorthand(latin) {
            const m = latin.trim().match(/^(\S+)\s+(\S+)\s+([1-4])(i(?:o)?)?$/i);
            if (!m) return null;
            return { present: m[1], infinitive: m[2], conj: m[3], isIo: !!m[4] };
        }

        function classifyPos(latin, english) {
            const rawParts = latin.split(',').map(s => s.trim());
            // "fessus, -a, -um" is endings, not principal parts — never a verb.
            // It's also not a noun: lumping adjectives in with nouns is what
            // let "bonus" turn up as a sentence subject ("the good lives in
            // the city"), so they get their own class and stay out of noun
            // slots in generated sentences.
            if (rawParts.length >= 2 && rawParts.slice(1).some(p => p.startsWith('-'))) return 'adjective';
            if (parseAnkiVerbShorthand(latin)) return 'verb';
            if (/^to\s/i.test(english.trim()) || rawParts.length >= 3) return 'verb';
            // A gloss that reads as a bare quality word is an adjective too.
            if (ADJECTIVE_GLOSSES.has(gloss(english).toLowerCase())) return 'adjective';
            return 'noun';
        }

        const ADJECTIVE_GLOSSES = new Set(['good','bad','great','big','small','large','huge','tiny','long','short',
            'tall','deep','high','low','wide','narrow','heavy','light','strong','weak','brave','cowardly','bold',
            'timid','fierce','gentle','kind','cruel','harsh','savage','happy','sad','angry','calm','anxious',
            'worried','tired','weary','eager','keen','lazy','busy','free','safe','dangerous','difficult','hard',
            'easy','new','old','young','ancient','beautiful','ugly','rich','poor','wise','foolish','stupid',
            'clever','holy','sacred','famous','unknown','true','false','faithful','wicked','wretched','miserable',
            'quick','swift','slow','many','few','whole','entire','same','other','similar','different','sick',
            'ill','healthy','dead','alive','empty','full','clean','dirty','bright','dark','cold','hot','warm',
            // Numerals behave as adjectives in a sentence, so they must not
            // land in the noun pool — "the three walked into the forest".
            'one','two','three','four','five','six','seven','eight','nine','ten',
            'first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth']);

        // Splits a vocab line into [latin, english]. Prefers a hyphen/equals/colon
        // surrounded by whitespace as the actual field separator — a bare,
        // unspaced hyphen is usually part of a Latin abbreviation (e.g. "-a, -um")
        // or a footnote marker, not the divider between Latin and English.
        function splitVocabLine(line) {
            let m = line.match(/^(.*?)\s[-=:]\s(.*)$/);
            if (!m) m = line.match(/^(.*?)[=:](.*)$/);
            if (!m) m = line.match(/^(.*?)-(.*)$/);
            if (!m) return null;
            return [m[1].trim(), m[2].trim()];
        }

        // Some source material lists English before Latin (common in some
        // textbook glossaries), which would otherwise get stored backwards.
        // Flag a field as "looks like English" two ways: common English
        // function words (skipping "a"/"an" — too short, and collide with
        // Latin abbreviation letters like the "-a" in "fessus, -a, -um"), and
        // for single-word glosses with no stopword at all, common English
        // derivational suffixes that essentially never end a Latin headword.
        // Plain single-word nouns like "eye"/"oculus" or "slave"/"servus" have
        // no stopword or suffix to catch — so this adds a direct dictionary
        // check against common English glosses that show up constantly in
        // beginner/intermediate Latin vocab lists. Not exhaustive (no list of
        // English words can be), but covers the common case.
        const COMMON_ENGLISH_WORDS = new Set(['eye','ear','hand','foot','feet','head','king','queen',
            'slave','master','servant','girl','boy','man','woman','child','children','dog','horse',
            'war','peace','love','fear','hope','gift','sword','wall','walls','camp','army','battle',
            'victory','enemy','friend','city','ship','road','gate','wound','blood','death','life',
            'god','goddess','temple','priest','sister','brother','father','mother','son','daughter',
            'home','house','field','forest','wood','mountain','river','sea','island','letter','book',
            'word','name','day','night','year','month','hour','time','money','gold','silver','iron',
            'fire','water','wind','storm','cloud','sun','moon','star','light','dark','tree','bird',
            'fish','sheep','dinner','guest','wine','food','bread','table','chair','door','roof',
            'chariot','spear','shield','soldier','general','senator','consul','citizen','stranger',
            'guard','prisoner','captive','wolf','lion','deer','mouse','apple','wing','arm','leg',
            'mouth','nose','heart','skin','bone','milk','honey','salt','bridge','tower','statue',
            'altar','garden','farm','farmer','sailor','ruler','leader','teacher','student','pupil',
            'doctor','judge','thief','liar','coward','hero','poet','actor','singer','hunter',
            'merchant','trader','beggar','poor','rich','wise','foolish','brave','cowardly','strong',
            'weak','tall','short','small','big','huge','tiny','old','young','new','good','bad',
            'kind','cruel','gentle','harsh','quick','slow','easy','hard']);

        // Scored rather than first-match-wins: several of the old English
        // markers are also real Latin words ("is" = he/that, "his" = to/by
        // these), so a perfectly good Latin sentence containing one used to be
        // flagged as English. Weighing English signals against Latin ones
        // makes that far less likely to misfire.
        const LATIN_MARKERS = /\b(et|sed|in|ad|cum|non|qui|quae|quod|est|sunt|erat|erant|ut|ne|ex|ab|per|pro|sub|atque|nec|quam|iam|tamen|enim|autem|hic|haec|hoc|ille|illa|illud|ipse|omnis|magnus|res|nam|si|quia|dum|postquam|antequam)\b/gi;
        const ENGLISH_MARKERS = /\b(the|of|to|was|were|been|being|and|who|that|with|not|her|they|them|their|from|into|will|would|had|has|have|for|but|when|which|there|these|those|because|after|before|while|are|our|your|its|it)\b/gi;

        function looksEnglish(s) {
            const t = String(s || '').trim();
            if (!t) return false;
            const en = (t.match(ENGLISH_MARKERS) || []).length;
            const la = (t.match(LATIN_MARKERS) || []).length;
            if (en || la) return en > la;
            // No function words either way — fall back to word shape.
            if (!t.includes(',') && /(ly|ing|tion|ness|ful|less|ment|able|ible|ous|ive|man|woman|ship|hood)$/i.test(t)) return true;
            if (!t.includes(',') && !t.includes(' ') && COMMON_ENGLISH_WORDS.has(t.toLowerCase())) return true;
            return false;
        }

        function parseVocab() {
            const lines = state.materials.rawText.split('\n');
            state.materials.vocabList = [];
            lines.forEach(line => {
                if (!line.trim()) return;
                // Comment and separator lines. Without this, a heading like
                // "# Numbers 1-10" is read as a vocab pair on its dash and
                // lands in the corpus as a fake word.
                const t = line.trim();
                if (t.startsWith('#') || t.startsWith('//') || /^[-=_*]{3,}$/.test(t) || /^---/.test(t)) return;
                const split = splitVocabLine(line);
                if (!split) return;
                let [latin, english] = split;
                // Strip trailing footnote-style digits some PDF extractions glue
                // onto a word (e.g. "neco 1" from a superscript reference marker)
                // — but NOT when it's actually the Anki verb-shorthand conjugation
                // number (e.g. "mitto mittere 3"), which needs to stay intact.
                if (state.materials.forceSwap) [latin, english] = [english, latin];
                // One normaliser now handles direction, marker stripping and
                // part-of-speech together, because they depend on each other:
                // you can't tell which side is Latin without reading the
                // endings, and you can't read the endings without stripping
                // the gender/conjugation markers first.
                const norm = normalizeVocabEntry(latin, english);
                if (norm) { latin = norm.latin; english = norm.english; }
                if (latin && english) {
                    const entry = { latin, english, pos: (norm && norm.pos) || classifyPos(latin, english), id: Date.now() + Math.random() };
                    if (norm && norm.govCase) entry.govCase = norm.govCase;
                    // Apply any prior AI enrichment (semantic category, word
                    // associations) for this exact headword, so it survives
                    // vocabList being rebuilt from scratch on every parse.
                    const enrich = state.materials.enrichment[latin];
                    if (enrich) {
                        if (enrich.pos) entry.pos = enrich.pos;
                        if (enrich.semanticCategory) entry.semanticCategory = enrich.semanticCategory;
                        if (Array.isArray(enrich.collocates)) entry.collocates = enrich.collocates;
                    }
                    state.materials.vocabList.push(entry);
                }
            });
            if (state.wordBank.length === 0 && state.materials.vocabList.length > 0) {
                state.wordBank = state.materials.vocabList.map((v, i) => ({
                    ...v, interval: 1, repetitions: 0, ease: 2.5, due: Date.now(), history: []
                }));
            }
        }

        // Pulls vocabulary straight out of Style Examples sentence pairs (which
        // already have both Latin and English, so no guessing needed) and adds
        // any genuinely new words to the corpus. Skips re-running when the
        // examples text hasn't changed since the last pass, so this doesn't
        // burn API calls re-scanning unchanged content on every save.
        async function extractVocabFromExamples() {
            const examples = state.materials.styleExamples;
            if (!examples || !examples.trim()) return;
            if (!aiConfigured()) return;
            if (state.materials.lastExtractedExamples === examples) return; // unchanged

            const statusEl = document.getElementById('enrichStatus');
            if (statusEl) statusEl.textContent = 'Scanning style examples for new vocab...';

            const existingHeadwords = new Set(state.materials.vocabList.map(v => v.latin.split(',')[0].trim().toLowerCase()));
            const prompt = `Below are Latin example sentences paired with their English translations. Identify the NOTEWORTHY vocabulary (nouns, verbs, adjectives, useful adverbs/prepositions) used in them — skip trivial words already assumed known (basic pronouns like is/ea/id, and/but conjunctions like et/sed, the relative qui/quae/quod).

For each word, give its Latin DICTIONARY form in standard vocab-list convention (nouns: nominative + genitive, e.g. "miles, militis"; verbs: principal parts, e.g. "mitto, mittere, misi, missus"; adjectives: "bonus, -a, -um") and its English meaning, based on how it's used in these sentences — not just any dictionary sense.

Sentences:
${examples.substring(0, 4000)}

Return ONLY JSON: {"vocab": ["latin dictionary form - english meaning", ...]}`;
            try {
                const result = await callAI(prompt, true);
                if (result && Array.isArray(result.vocab)) {
                    const newLines = [];
                    result.vocab.forEach(line => {
                        if (typeof line !== 'string') return;
                        const split = splitVocabLine(line);
                        if (!split) return;
                        const headword = split[0].split(',')[0].trim().toLowerCase();
                        if (headword && !existingHeadwords.has(headword)) {
                            existingHeadwords.add(headword);
                            newLines.push(line);
                        }
                    });
                    if (newLines.length > 0) {
                        state.materials.rawText += `\n\n--- from Style Examples ---\n` + newLines.join('\n');
                        const area = document.getElementById('rawInputArea');
                        if (area) area.value = state.materials.rawText;
                        parseVocab();
                        if (statusEl) statusEl.textContent = `Added ${newLines.length} new word(s) from style examples.`;
                    } else if (statusEl) {
                        statusEl.textContent = 'No new vocab found in style examples.';
                    }
                }
            } catch(e) {
                console.warn('Vocab extraction from examples failed', e);
            }
            state.materials.lastExtractedExamples = examples;
            saveState();
        }

        function saveMaterials() {
            state.materials.rawText = document.getElementById('rawInputArea').value;

            render();
            runAutoPipeline(); // fire-and-forget — extracts new vocab from examples, then indexes everything new
        }

        async function runAutoPipeline() {
            await extractVocabFromExamples();
            await autoIndexNewWords();
        }

        // Manual "Sort with AI" button: runs the same vocab/grammar split used
        // for PDF uploads on whatever's currently pasted into the corpus box —
        // for when a grammar sheet gets pasted as text rather than uploaded.
        async function autoSortCorpus() {
            if (!aiConfigured()) {
                alert('Set up an AI connection in Settings first — sorting vocab from grammar needs it.');
                return;
            }
            const btn = document.getElementById('sortBtn');
            const area = document.getElementById('rawInputArea');
            const original = area.value;
            const originalLines = original.split('\n').filter(l => l.trim() && !l.trim().startsWith('#') && !l.trim().startsWith('---'));

            if (originalLines.length === 0) { alert('Nothing to sort — the corpus box is empty.'); return; }
            if (!confirm(`Sort ${originalLines.length} lines? Vocab stays here; grammar and example sentences move to their own boxes. You can undo this straight afterwards.`)) return;

            btn.disabled = true;

            // Sort in chunks. Sending a whole corpus in one call asks the model
            // to echo back hundreds of lines, which overruns its output limit —
            // the reply comes back truncated or empty and the box gets wiped.
            // That is exactly the "everything disappeared" failure.
            const CHUNK = 60;
            const chunks = [];
            for (let i = 0; i < originalLines.length; i += CHUNK) chunks.push(originalLines.slice(i, i + CHUNK));

            const allVocab = [];
            let allGrammar = '', allExamples = '';
            let failedChunks = 0;

            for (let i = 0; i < chunks.length; i++) {
                btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Sorting ${i + 1}/${chunks.length}...`;
                try {
                    const sorted = await sortMaterialWithAI(chunks[i].join('\n'), 'pasted corpus');
                    if (Array.isArray(sorted.vocab)) allVocab.push(...sorted.vocab);
                    if (sorted.grammar && sorted.grammar.trim()) allGrammar += (allGrammar ? '\n' : '') + sorted.grammar.trim();
                    if (sorted.examples && sorted.examples.trim()) allExamples += (allExamples ? '\n' : '') + sorted.examples.trim();
                } catch(e) {
                    // A failed chunk must not cost the lines in it.
                    console.warn(`Sort chunk ${i + 1} failed, keeping its lines unchanged:`, e);
                    allVocab.push(...chunks[i]);
                    failedChunks++;
                }
                if (i < chunks.length - 1) await new Promise(r => setTimeout(r, 800));
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Sort with AI`;

            // Last line of defence: if the result would throw away a large part
            // of the corpus, don't apply it silently.
            const kept = allVocab.length + (allGrammar ? allGrammar.split('\n').length : 0) + (allExamples ? allExamples.split('\n').length : 0);
            if (kept < originalLines.length * 0.6) {
                alert(`Sorting would have discarded most of your corpus (${originalLines.length} lines in, ${kept} out), so nothing has been changed.\n\nThis usually means the AI connection is returning incomplete replies. Your corpus is untouched.`);
                return;
            }

            // Snapshot for undo before anything is overwritten.
            state.materials.undoSnapshot = {
                rawText: original,
                grammarNotes: state.materials.grammarNotes || '',
                styleExamples: state.materials.styleExamples || ''
            };

            area.value = allVocab.join('\n');
            if (allGrammar) {
                const gArea = document.getElementById('grammarInputArea');
                const combined = (state.materials.grammarNotes ? state.materials.grammarNotes + '\n\n' : '') + allGrammar;
                state.materials.grammarNotes = combined;
                if (gArea) gArea.value = combined;
            }
            if (allExamples) {
                const eArea = document.getElementById('styleExamplesArea');
                const combinedEx = (state.materials.styleExamples ? state.materials.styleExamples + '\n\n' : '') + allExamples;
                state.materials.styleExamples = combinedEx;
                if (eArea) eArea.value = combinedEx;
            }
            saveMaterials();
            alert(`Sorted.\n${allVocab.length} vocab lines kept here.` +
                  (allGrammar ? `\nGrammar moved to Grammar Notes.` : '') +
                  (allExamples ? `\nExample sentences moved to Style Examples.` : '') +
                  (failedChunks ? `\n\n${failedChunks} batch(es) failed and were left exactly as they were.` : '') +
                  `\n\nIf this isn't what you wanted, press Undo Sort.`);
        }

        // Sorting rewrites three fields at once, so a plain "it looked wrong"
        // needs a single way back.
        function undoSort() {
            const snap = state.materials.undoSnapshot;
            if (!snap) { alert('Nothing to undo.'); return; }
            if (!confirm('Restore your materials to how they were before the last sort?')) return;
            state.materials.rawText = snap.rawText;
            state.materials.grammarNotes = snap.grammarNotes;
            state.materials.styleExamples = snap.styleExamples;
            state.materials.undoSnapshot = null;
            parseVocab();
            saveState();
            render();
        }

        // Modern Anki (2.1.50+, i.e. basically every export today) stores the real
        // deck data in a zstd-compressed collection.anki21b file, and keeps
        // collection.anki2 around only as an empty/placeholder stub for very old
        // Anki versions. Reading collection.anki2 directly (the old approach) picks
        // up that empty stub, which is why cards silently failed to import.
        async function getCollectionBytes(zip) {
            if (zip.file("collection.anki21b")) {
                const raw = await zip.file("collection.anki21b").async("uint8array");
                if (typeof fzstd === 'undefined') {
                    throw new Error("Couldn't load the zstd decompressor (fzstd) — check your internet connection.");
                }
                return fzstd.decompress(raw);
            }
            if (zip.file("collection.anki21")) {
                return await zip.file("collection.anki21").async("uint8array");
            }
            if (zip.file("collection.anki2")) {
                return await zip.file("collection.anki2").async("uint8array");
            }
            throw new Error("No collection database found inside this .apkg file.");
        }

        // Anki fields carry HTML, media tags, cloze wrappers and non-breaking
        // spaces — all of which would otherwise end up inside a vocab entry.
        function cleanAnkiField(field) {
            return String(field || '')
                .replace(/\[sound:[^\]]*\]/g, '')
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/<[^>]*>/g, '')
                .replace(/\{\{c\d+::(.*?)(?:::[^}]*)?\}\}/g, '$1')
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function handleFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            const textarea = document.getElementById('rawInputArea');

            if (type === 'pdf') {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let rawExtracted = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    rawExtracted += content.items.map(item => item.str).join(' ') + '\n';
                }

                const avgCharsPerPage = rawExtracted.trim().length / pdf.numPages;
                if (avgCharsPerPage < 20) {
                    alert(`This PDF looks like a scanned image with little to no selectable text (~${Math.round(avgCharsPerPage)} characters/page extracted). Text extraction can't read scanned pages — try exporting a text-based PDF, or paste/retype the content directly into the corpus box instead.`);
                    event.target.value = '';
                    return;
                }

                await sortAndInsertMaterial(rawExtracted, file.name, textarea);
            } else if (type === 'apkg') {
                try {
                    const zip = await JSZip.loadAsync(file);
                    const dbFile = await getCollectionBytes(zip);
                    const SQL = await initSqlJs({ locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` });
                    const db = new SQL.Database(dbFile);
                    const res = db.exec("SELECT flds FROM notes");

                    // Everything already in the corpus, keyed by headword, so a
                    // re-import of an overlapping deck doesn't duplicate.
                    const existing = new Set(state.materials.vocabList.map(v => v.latin.split(',')[0].trim().toLowerCase()));
                    const lines = [];
                    let cardCount = 0, skipped = 0, flipped = 0;

                    if (res.length > 0) {
                        res[0].values.forEach(val => {
                            const fields = String(val[0]).split('\x1f').map(cleanAnkiField).filter(Boolean);
                            if (fields.length < 2) return;
                            let [lat, eng] = fields;
                            // Anki decks are inconsistent about which field is
                            // which, and one collection often mixes both
                            // directions. Both fields are clean here (unlike a
                            // pasted line), so decide per card.
                            if (looksEnglish(lat) && !looksEnglish(eng)) { const t = lat; lat = eng; eng = t; flipped++; }
                            const head = lat.split(',')[0].trim().toLowerCase();
                            if (!head || existing.has(head)) { skipped++; return; }
                            existing.add(head);
                            lines.push(`${lat} - ${eng}`);
                            cardCount++;
                        });
                    }

                    if (cardCount === 0) {
                        alert(skipped > 0
                            ? `Nothing new imported — all ${skipped} card(s) in this deck are already in your corpus.`
                            : 'No flashcards were found inside this .apkg file. It may use a note type this parser can\'t read, or be empty.');
                    } else {
                        // The old version only touched the textarea and never
                        // saved, so anything imported vanished the moment the
                        // view re-rendered. Write it into state and parse it.
                        state.materials.rawText = (state.materials.rawText || '').replace(/\s+$/, '')
                            + `\n\n--- ${file.name} (${cardCount} cards) ---\n` + lines.join('\n');
                        if (textarea) textarea.value = state.materials.rawText;
                        parseVocab();
                        saveState();
                        render();
                        alert(`Imported ${cardCount} card(s) from ${file.name}.` +
                              (skipped ? `\n${skipped} skipped as duplicates.` : '') +
                              (flipped ? `\n${flipped} were written English-first and have been flipped.` : '') +
                              `\n\nYour corpus now has ${state.materials.vocabList.length} words. Use the search box under Parsed Vocabulary to check for a specific one.`);
                        runAutoPipeline();
                    }
                } catch(e) {
                    console.error(e);
                    alert('Error parsing APKG: ' + e.message);
                }
            } else if (type === 'image') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    state.materials.images.push(e.target.result);
                    saveState();
                    render();
                };
                reader.readAsDataURL(file);
                return;
            }
            event.target.value = '';
        }

        function removeImage(idx) {
            state.materials.images.splice(idx, 1);
            saveState();
            render();
        }

        function addWordBank() {

        async function testConnection() {
            // Test with whatever's currently in the fields, even if not saved
            // yet — so the user can check before committing to Save.
            const key = document.getElementById('cfg_key').value;
            const url = document.getElementById('cfg_url').value;
            const model = document.getElementById('cfg_model').value;
            const btn = document.getElementById('testConnBtn');
            const resultEl = document.getElementById('testConnResult');
            if (!url) {
                resultEl.innerHTML = '<span class="text-terracotta-600">Enter an API URL first.</span>';
                return;
            }
            if (!/\/v\d/.test(url)) {
                resultEl.innerHTML = '<span class="text-terracotta-600">The URL is usually missing its version path — e.g. http://localhost:1234<strong>/v1</strong>. Testing anyway...</span>';
            }
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Testing...';
            resultEl.innerHTML = '';
            try {
                const res = await fetch(`${normalizeApiUrl(url)}/chat/completions`, {
                    method: 'POST',
                    headers: buildAuthHeaders(key),
                    // No max_tokens: a reasoning model spends its budget on the
                    // think block and returns an empty message with a low cap,
                    // which reads as a failure when the connection is fine.
                    body: JSON.stringify({ model, messages: [{ role: 'user', content: 'Reply with just the word OK.' }] })
                });
                if (res.ok) {
                    // A 200 status alone isn't proof the request actually
                    // worked — some local servers return 200 with a bogus
                    // body for a request they didn't recognize (e.g. a
                    // malformed URL), rather than a proper error status. Check
                    // the body actually contains a real answer.
                    let data;
                    try { data = await res.json(); } catch(e) { data = null; }
                    if (data && data.choices && data.choices[0] && data.choices[0].message) {
                        resultEl.innerHTML = '<span class="text-sage-700"><i class="fa-solid fa-check-circle mr-1"></i>Connected — this model and key are working.</span>';
                    } else {
                        resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Got a 200 response, but not a real answer — check the API URL doesn\'t have a trailing slash, and that the model name matches exactly what the server reports.</span>';
                    }
                } else if (res.status === 429) {
                    resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Rate limited (429) — the key/URL work, but you\'ve hit the provider\'s request limit for now. Try again shortly.</span>';
                } else if (res.status === 401 || res.status === 403) {
                    resultEl.innerHTML = '<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Auth error (' + res.status + ') — check the API key is correct and active.</span>';
                } else {
                    resultEl.innerHTML = `<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Request failed (${res.status}) — check the API URL and model name.</span>`;
                }
            } catch(e) {
                const localHint = isLocalUrl(url)
                    ? " Local server checklist: it's running; CORS is enabled in its server settings; and this page was opened as a file, not over https."
                    : ' Check the URL is reachable and allows browser (CORS) requests.';
                resultEl.innerHTML = `<span class="text-terracotta-600"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Couldn't reach the server.${localHint}</span>`;
            }
            btn.disabled = false;
            btn.textContent = originalText;
        }

        function saveSettings() {
            state.settings.apiKey = document.getElementById('cfg_key').value;
            state.settings.apiUrl = normalizeApiUrl(document.getElementById('cfg_url').value);
            state.settings.model = document.getElementById('cfg_model').value.trim();

        // Fills in the fields for the connection types actually being used,
        // so the two settings that have repeatedly caused silent failures

        function applyPreset(kind) {

            if (kind === 'gemini') { f.url.value = 'https://generativelanguage.googleapis.com/v1beta/openai'; f.model.value = 'gemini-3.5-flash-lite'; f.key.focus(); }

        function resetProgress() {
            if (!confirm('Reset ALL progress? This cannot be undone.')) return;
            state.stats = { completedToday: 0, streak: 0, totalAnswered: 0, totalCorrect: 0, lastStudyDate: null };
            state.wordBank.forEach(w => { w.interval = 1; w.repetitions = 0; w.ease = 2.5; w.due = Date.now(); w.history = []; });
            saveState();

        // ==================== QUIZ ENGINE ====================

        async function startSpecific(type) {
            state.quiz.isInfinite = true;
            state.quiz.type = type;
            state.quiz.index = 0;
            state.quiz.answered = false;
            state.quiz.results = [];
            state.quiz.questions = [];
            navigateTo('quiz'); // shows the loading spinner immediately
            state.quiz.questions = await generateQuestions(type, state.settings.batchSize || 5);
            saveState();
