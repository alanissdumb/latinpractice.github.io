                        if (patterns === SENTENCE_PATTERNS) {
                            out.lat = capitalise(out.lat);
                            out.eng = capitalise(out.eng);
                        }
                        return out;
                    }
                }
                return null;
            }

            const seen = new Set();
            // Real past-paper sentences are still worth serving when the AI is
            // unavailable — they need no generation at all.
            const offlineNeeded = Math.max(0, count - realQuestions.length);
            // Draw without replacement so a short batch doesn't ask the same
            // word twice — the old modulo/random picks repeated constantly.
            const makeQueue = arr => { let q = shuffled(arr); return () => { if (!q.length) q = shuffled(arr); return q.pop(); }; };
            const nextVocab = makeQueue(vocab);
            const nextNominal = makeQueue(nouns.concat(adjectives).length ? nouns.concat(adjectives) : vocab);
            const nextVerb = makeQueue(verbs.length ? verbs : vocab);
            const ppPool = verbs.filter(vv => !parseAnkiVerbShorthand(vv.latin) && vv.latin.split(',').length >= 3);
            const nextPP = ppPool.length ? makeQueue(ppPool) : null;
            const gcBank = shuffled([
                { form: 'navem', ans: 'Singular, Feminine, Accusative' },
                { form: 'proelii', ans: 'Singular, Neuter, Genitive' },
                { form: 'fluminum', ans: 'Plural, Neuter, Genitive' },
                { form: 'senatui', ans: 'Singular, Masculine, Dative' },
                { form: 'tempestatis', ans: 'Singular, Feminine, Genitive' },
                { form: 'nautas', ans: 'Plural, Masculine, Accusative' },
                { form: 'militibus', ans: 'Plural, Masculine, Dative or Ablative' },
                { form: 'urbium', ans: 'Plural, Feminine, Genitive' },
                { form: 'corpora', ans: 'Plural, Neuter, Nominative or Accusative' },
                { form: 'manu', ans: 'Singular, Feminine, Ablative' },
                { form: 'rei', ans: 'Singular, Feminine, Genitive or Dative' },
                { form: 'ducem', ans: 'Singular, Masculine, Accusative' }
            ]);
            const mtvBank = shuffled([
                { form: 'ambulabit', ans: 'Indicative, Future, Active' },
                { form: 'laudata est', ans: 'Indicative, Perfect, Passive' },
                { form: 'regeret', ans: 'Subjunctive, Imperfect, Active' },
                { form: 'abstulit', ans: 'Indicative, Perfect, Active' },
                { form: 'fac', ans: 'Imperative, Present, Active' },
                { form: 'monuissem', ans: 'Subjunctive, Pluperfect, Active' },
                { form: 'docebamur', ans: 'Indicative, Imperfect, Passive' },
                { form: 'absit', ans: 'Subjunctive, Present, Active' },
                { form: 'missum erat', ans: 'Indicative, Pluperfect, Passive' },
                { form: 'audientur', ans: 'Indicative, Future, Passive' },
                { form: 'portate', ans: 'Imperative, Present, Active' },
                { form: 'ablatum erit', ans: 'Indicative, Future Perfect, Passive' },
                { form: 'capiuntur', ans: 'Indicative, Present, Passive' },
                { form: 'venissent', ans: 'Subjunctive, Pluperfect, Active' },
                { form: 'hortatus est', ans: 'Indicative, Perfect, Active (deponent)' },
                { form: 'duceremur', ans: 'Subjunctive, Imperfect, Passive' }
            ]);

            for (let i = 0; i < (SENTENCE_TYPES.includes(type) ? offlineNeeded : count); i++) {
                let q = { type };

                switch(type) {
                    case 'vocab': {
                        const v = nextVocab();
                        q = { type: 'vocab', prompt: dir === 'latToEng' ? v.latin : v.english,
                              target: dir === 'latToEng' ? v.english : v.latin, extra: '' };
                        break;
                    }
                    case 'latToEng':
                    case 'engToLat': {
                        const made = makeFrom(PHRASE_PATTERNS, seen);
                        if (!made) { q.prompt = 'in urbe'; q.target = 'in the city'; break; }
                        q.prompt = type === 'latToEng' ? made.lat : made.eng;
                        q.target = type === 'latToEng' ? made.eng : made.lat;
                        break;
                    }
                    case 'latSentence':
                    case 'engSentence': {
                        const made = makeFrom(SENTENCE_PATTERNS, seen);
                        if (!made) { q.prompt = 'nuntius epistulam mittit.'; q.target = 'The messenger sends the letter.'; break; }
                        q.prompt = type === 'latSentence' ? made.lat : made.eng;
                        q.target = type === 'latSentence' ? made.eng : made.lat;
                        break;
                    }
                    case 'declining': {
                        const v = nextNominal();
                        const forms = getDeclension(v.latin);
                        const isAdj = (v.pos || classifyPos(v.latin, v.english)) === 'adjective';
                        q.prompt = `Decline (${isAdj ? 'masculine singular' : 'singular'}): ${v.latin}`;
                        q.target = `Nom. ${forms[0]}, Voc. ${forms[1]}, Acc. ${forms[2]}, Gen. ${forms[3]}, Dat. ${forms[4]}, Abl. ${forms[5]}`;
                        break;
                    }
                    case 'conjugation': {
                        const v = nextVerb();
                        const f = getConjugation(v.latin);
                        q.prompt = `Conjugate (present passive): ${v.latin}`;
                        q.target = `1st: ${f[0]}, 2nd: ${f[1]}, 3rd: ${f[2]}, 1st pl: ${f[3]}, 2nd pl: ${f[4]}, 3rd pl: ${f[5]}`;
                        break;
                    }
                    case 'genderCase': {
                        const pick = gcBank[i % gcBank.length];
                        q.prompt = `What is the number, gender, and case of "${pick.form}"?`;
                        q.target = pick.ans;
                        break;
                    }
                    case 'principalParts': {
                        if (!nextPP) {
                            q.prompt = 'Give the principal parts of: mitto';
                            q.target = 'mitto, mittere, misi, missum';
                            q.extra = 'No verbs with full principal parts in your corpus yet — add some in Materials.';
                            break;
                        }
                        const v = nextPP();
                        q.prompt = `Give the principal parts of: ${headword(v.latin)}`;
                        q.target = v.latin;
                        break;
                    }
                    case 'moodTenseVoice': {
                        const pick = mtvBank[i % mtvBank.length];
                        q.prompt = `Identify mood, tense, and voice: "${pick.form}"`;
                        q.target = pick.ans;
                        break;
                    }
                    case 'unseen': {
                        const lines = [];
                        for (let k = 0; k < 3; k++) {
                            const made = makeFrom(SENTENCE_PATTERNS, seen);
                            if (made) lines.push(made);
                        }
                        if (lines.length === 0) {
                            q.prompt = 'nuntius epistulam mittit. cives epistulam legunt.';
                            q.target = 'The messenger sends the letter. The citizens read the letter.';
                            break;
                        }
                        q.prompt = lines.map(l => l.lat).join(' ');
                        q.target = lines.map(l => l.eng).join(' ');
                        break;
                    }
                    default: {
                        const made = makeFrom(SENTENCE_PATTERNS, seen);
                        q.prompt = made ? made.lat : 'nuntius epistulam mittit.';
                        q.target = made ? made.eng : 'The messenger sends the letter.';
                    }
                }
                q.source = 'fallback';
                questions.push(q);
            }
            return shuffled([...realQuestions, ...questions]);
        }

        function attachKeybinds() {
            const std = document.getElementById('ans_standard');
            const vcb = document.getElementById('ans_vocab');
            
            if (std) {
                std.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleEnter(); }
                });
                std.focus();
            }
            
            if (vcb) {
                vcb.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); handleEnter(); }
                });
                vcb.focus();
            }
        }

        function handleEnter() {
            if (state.quiz.answered) {
                nextQuestion();
            } else {
                evaluateAnswer();
            }
        }

        function toggleAskInput() {
            const area = document.getElementById('askInputArea');
            area.classList.toggle('hidden');
            if (!area.classList.contains('hidden')) document.getElementById('askInput').focus();
        }

        async function askAboutQuestion() {
            const input = document.getElementById('askInput');
            const question = input.value.trim();
            if (!question) return;
            if (!state.settings.apiKey || !state.settings.apiUrl) {
                alert('Add an API key in Settings first — this needs the AI to answer.');
                return;
            }
            const ctx = state.quiz.askContext;
            const answersEl = document.getElementById('askAnswers');
            const btn = document.getElementById('askSubmitBtn');
            btn.disabled = true;
            const qId = 'ask_' + Date.now();
            answersEl.innerHTML += `
                <div class="bg-stone-50 border border-stone-200 rounded-xl p-3 text-sm" id="${qId}">
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-stone-400 italic mt-1"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Thinking...</p>
                </div>`;
            input.value = '';
            try {
                const prompt = `A Latin student is asking about a practice question they just did.
Question they were given: "${ctx.prompt}"
Correct/model answer: "${ctx.target}"
What they submitted: "${ctx.userAns || '(nothing, they revealed the answer)'}"
Their question: "${question}"
Answer their specific question clearly and directly, like a teacher explaining a grammar point — a few sentences is fine, don't pad it out. If their question reveals a misunderstanding about a specific grammar term, correct it plainly.`;
                const answer = await callAI(prompt, false);
                document.getElementById(qId).innerHTML = `
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-stone-600 mt-1">${answer}</p>`;
            } catch(e) {
                document.getElementById(qId).innerHTML = `
                    <p class="font-bold text-stone-700">You asked: ${question}</p>
                    <p class="text-terracotta-600 mt-1">Couldn't get an answer right now (${e.message}). Try again in a moment.</p>`;
            }
            btn.disabled = false;
        }

        async function evaluateAnswer() {
            const q = state.quiz.questions[state.quiz.index];
            const btn = document.getElementById('submitBtn');
            let userAns = "";
            const isVocab = q.type === 'vocab';
            const isEngLat = q.type === 'engToLat' || q.type === 'engSentence';
            
            if (isVocab) {
                userAns = document.getElementById('ans_vocab').value.trim();
            } else {
                userAns = document.getElementById('ans_standard').value.trim();
            }
            
            state.quiz.answered = true;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
            
            let feedback = '';
            let isCorrect = false;
            const cleanAns = userAns.toLowerCase().replace(/[.,!?;:]/g,'').trim();
            const cleanTgt = q.target.toLowerCase().replace(/[.,!?;:]/g,'').trim();

            // Offline fallback only — exact match, or for vocab, an exact match
            // against any one synonym in a comma/semicolon-separated gloss.
            // (Previously this accepted ANY 3+ letter substring of the target,
            // e.g. "kin" would match "king" — too lenient to trust.)
            function heuristicCorrect() {
                if (isVocab) {
                    const parts = cleanTgt.split(/[,;\/]| or /).map(s => s.trim()).filter(Boolean);
                    return parts.includes(cleanAns);
                }
                return cleanAns === cleanTgt;
            }

            if (userAns === '') {
                isCorrect = false;
            } else if (aiConfigured()) {
                // Let the AI make the actual correctness call, not just add
                // commentary after a rigid string-match — translation questions
                // in particular have many valid phrasings that exact-match would
                // wrongly reject.
                try {
                    const prompt = `You are marking a Latin student's answer like a teacher.
Question: "${q.prompt}"
Model/expected answer: "${q.target}"
Student's answer: "${userAns}"
Judge whether the student's answer is an acceptable answer — accept valid alternative phrasing, synonyms, and word order for translations; for vocab, accept any valid synonym. Don't require an exact word-for-word match to the model answer.
Return ONLY JSON: {"correct": true or false, "feedback": "1-2 sentence teacher feedback, concise — if correct, briefly affirm; if wrong, explain specifically what was wrong (tense, agreement, word order, vocabulary, etc.)"}`;
                    const result = await callAI(prompt, true);
                    if (result && typeof result.correct === 'boolean') {
                        isCorrect = result.correct;
                        feedback = typeof result.feedback === 'string' ? result.feedback : '';
                    } else {
                        isCorrect = heuristicCorrect();
                    }
                } catch(e) {
                    isCorrect = heuristicCorrect();
                    feedback = "(AI marking unavailable right now — marked by exact match instead.)";
                }
            } else {
                isCorrect = heuristicCorrect();
            }
            
            const fb = document.getElementById('feedbackBox');
            fb.classList.remove('hidden');
            
            if (userAns === '') {
                fb.innerHTML = `
                    <div class="text-sm border-b border-stone-200 pb-2 mb-2 font-bold uppercase tracking-wider text-stone-500">
                        <i class="fa-solid fa-eye mr-1"></i> Revealed
                    </div>
                    <div class="space-y-1 text-sm font-serif text-stone-800">
                        <p><strong class="font-sans text-xs uppercase text-stone-500">Correct Answer:</strong> ${q.target}</p>
                    </div>
                `;
            } else {
                fb.innerHTML = `
                    <div class="text-sm border-b border-stone-200 pb-2 mb-2 font-bold uppercase tracking-wider ${isCorrect ? 'text-sage-700' : 'text-terracotta-600'}">
                        ${isCorrect ? '<i class="fa-solid fa-check-circle mr-1"></i> Optime!' : '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Feedback'}
                    </div>
                    <div class="space-y-1 text-sm font-serif text-stone-800">
                        <p><strong class="font-sans text-xs uppercase text-stone-500">Correct:</strong> ${q.target}</p>
                        <p class="pt-1"><strong class="font-sans text-xs uppercase text-stone-500">Yours:</strong> <span class="${isCorrect ? 'text-sage-700' : 'text-terracotta-700'}">${userAns}</span></p>
                        ${feedback ? `<p class="pt-2 text-stone-600 italic border-t border-stone-200 mt-2 pt-2">${feedback}</p>` : ''}
                    </div>
                `;
            }

            // Store context for "ask a question" — needs the question, correct
            // answer, and what was submitted, regardless of right/wrong.
            state.quiz.askContext = { prompt: q.prompt, target: q.target, userAns, type: q.type };
            const askBox = document.getElementById('askBox');
            askBox.classList.remove('hidden');
            askBox.innerHTML = `
                <button onclick="toggleAskInput()" id="askToggleBtn" class="text-xs font-bold text-stone-500 hover:text-stone-800 transition">
                    <i class="fa-solid fa-circle-question mr-1"></i> Not sure why? Ask about this question
                </button>
                <div id="askInputArea" class="hidden mt-2">
                    <div class="flex gap-2">
                        <input type="text" id="askInput" placeholder="e.g. why is this indicative not subjunctive?" class="flex-1 text-sm border border-stone-300 rounded-lg p-2.5 focus:ring-2 focus:ring-sage-500 outline-none">
                        <button onclick="askAboutQuestion()" id="askSubmitBtn" class="px-4 py-2 bg-stone-900 hover:bg-black text-white text-sm font-bold rounded-lg transition">Ask</button>
                    </div>
                    <div id="askAnswers" class="space-y-2 mt-3"></div>
                </div>
            `;
            
            btn.innerHTML = `Next <span class="text-xs opacity-70 ml-1">(Enter)</span> <i class="fa-solid fa-arrow-right ml-2"></i>`;
            btn.className = "w-full sm:w-auto px-10 py-4 bg-stone-900 hover:bg-black text-white font-bold rounded-xl shadow-lg transition text-lg mt-4";
            btn.disabled = false;
            btn.onclick = () => { recordTypedResult(isCorrect && userAns !== ''); nextQuestion(); };
            
            state.stats.completedToday++;
            state.stats.totalAnswered++;
            if (isCorrect) state.stats.totalCorrect++;
            updateStreak();
            saveState();
        }

        function recordTypedResult(correct) {
            state.quiz.results.push({ correct });
        }

        function updateStreak() {
            const today = new Date().toDateString();
            if (state.stats.lastStudyDate !== today) {
                const yesterday = new Date(Date.now() - 86400000).toDateString();
                if (state.stats.lastStudyDate === yesterday) state.stats.streak++;
                else state.stats.streak = 1;
                state.stats.lastStudyDate = today;
            }
        }

        // Top up the question queue in the background well before it runs
        // out, so pressing Next never sits on a blank screen waiting for a
        // generation call (which on a local model can take 30s+).
        let prefetching = false;
        async function prefetchMore() {
            if (prefetching || !state.quiz.isInfinite) return;
            prefetching = true;
            try {
                const type = state.quiz.type;
                const more = await generateQuestions(type, state.settings.batchSize || 5);
                if (state.quiz.isInfinite && state.quiz.type === type) {
                    state.quiz.questions.push(...more);
                    saveState();
                    // If the user is already sitting on the loading screen
                    // waiting, show the newly arrived question now.
                    if (!state.quiz.questions[state.quiz.index - 1] || state.quiz.index >= state.quiz.questions.length - more.length) render();
                }
            } catch(e) { console.warn('Prefetch failed', e); }
            prefetching = false;
        }

        async function nextQuestion() {
            state.quiz.index++;
            state.quiz.answered = false;

            // Kick off a top-up two questions before the end, without awaiting.
            if (state.quiz.isInfinite && state.quiz.index >= state.quiz.questions.length - 2) {
                prefetchMore();
            }

            if (state.quiz.index >= state.quiz.questions.length) {
                if (state.quiz.isInfinite) {
                    render(); // spinner; prefetchMore() will re-render on arrival
                    return;
                }
                const correct = state.quiz.results.filter(r => r.correct).length;
                const total = state.quiz.results.length;
                alert(`Session complete! ${correct}/${total} correct.`);
                navigateTo('home');
                return;
            }

            render();
        }

        function exportHTML() {
            const code = document.documentElement.outerHTML;
            const blob = new Blob([code], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'latin_practice.html';
            a.click();
        }

        async function init() {
            loadState();
            await hydrateImages();
            render();
        }
        init();
    </script>
</body>
</html>
